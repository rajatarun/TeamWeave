name: Deploy TeamWeave Backend (SAM)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Mirrors the EnableAgentCore template parameter; see the provisioning step.
  ENABLE_AGENTCORE: "true"
  STACK_NAME: tarun-content-team
  SHARED_STACK_NAME: tarun-teamweave-shared
  BEDROCK_AGENTS_STACK_NAME: tarun-bedrock-agents
  CONTEXTWEAVE_STACK_NAME: contextweave-rag-prod
  FOUNDATION_MODEL_ID: amazon.nova-micro-v1:0
  AGENT_SERVICE_ROLE_ARN: arn:aws:iam::239571291755:role/BedrockAgentServiceRole-Tarun
  TEAM_CONFIG_PREFIX: teams
  VECTOR_DB_TABLE: resume-rag-db
  GEMINI_SECRET_ARN: arn:aws:secretsmanager:us-east-1:239571291755:secret:gemini/api_key-SKx2NV
  SAM_DEPLOYER_ROLE_NAME: teamweave-github-actions-sam-deployer
  ASSUME_ROLE_ARN: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
  # VPC / networking config consumed by the shared stack
  VPC_ID: vpc-f3c92a8a
  INTERNET_GATEWAY_ID: ""
  LAMBDA_SUBNET_CIDR_AZ1: "172.31.96.0/24"
  LAMBDA_SUBNET_CIDR_AZ2: "172.31.97.0/24"
# One deploy at a time. Three pushes in quick succession ran three deploys
# concurrently against a single CloudFormation stack and a single provisioning
# Lambda; queueing is what that should have done.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record when this deploy started
        # The on-failure dump reports only failures at or after this. It used
        # `${{ github.run_started_at }}`, which expanded to an empty string
        # here -- so the dump exited 2 and the run that needed a diagnosis got
        # a second red step instead of one. A timestamp taken in the job is
        # self-contained and always in a form Python can parse.
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ASSUME_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Push docs to expertise RAG artifacts
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          find . \( -name "*.md" -o -name "*.puml" \) \
            -not -path "*/assets/*" | while read -r file; do
            aws s3 cp "$file" "s3://expertise-rag-artifacts-239571291755-prod/raw/${REPO_NAME}/${file#./}"
          done

      # CLAUDE.md has said "run pytest before any PR" for as long as the suite
      # has existed, but nothing enforced it: this workflow went straight from
      # checkout to sam build, so 463 tests ran only on whatever machine a
      # contributor remembered to run them on. They need no AWS, so they run
      # here, before the build -- including the contract tests that compare
      # openapi/teamweave.yaml against the template's routes and the handlers'
      # validation sets.
      # requirements-dev.txt, not `requirements.txt pytest`. The first version
      # of this step installed the latter and the run failed in one second,
      # before a single test executed: five test modules import boto3/botocore
      # at module scope and one parses YAML, and none of those are in
      # requirements.txt -- correctly, since the Lambda runtime provides boto3
      # and shipping a second copy in the bundle is wasted space. A collection
      # error is not a test failure, and it is easy to misread as one.
      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Informational on purpose. The hard gate is in tests/ — offline and
      # deterministic. This one resolves hostnames, and it reads a DNS outage
      # as "no service has dual-stack", so failing the deploy on it would turn
      # a network blip into a red build. What it is here for is the direction
      # tests cannot see: a pin that has become unnecessary because AWS has
      # since published a dual-stack endpoint, which is traffic still paying
      # for NAT that no longer has to.
      - name: Check IPv4 pins against what AWS serves today
        continue-on-error: true
        run: python scripts/check_dualstack_pins.py --region "${AWS_REGION:-us-east-1}"

      - name: SAM Build
        run: |
          cd infra
          rm -rf .aws-sam
          sam build -t template.yaml

      - name: Validate SAM Template
        run: |
          cd infra
          sam validate --lint

      - name: Deploy Shared Infrastructure Stack
        run: |
          cd infra

          # Discover the VPC's actual associated IPv6 CIDR from AWS — source of truth.
          # This avoids hardcoding a CIDR that may differ from what VpcIpv6CidrBlock assigned.
          #
          # The state is at Ipv6CidrBlockState.State. There is no top-level
          # State on a VpcIpv6CidrBlockAssociation, so `[?State==...]` filters
          # every element away and the whole expression yields None — quietly,
          # because a JMESPath that matches nothing is not an error. That is
          # what this function did, on both passes of the two-pass deploy, so
          # VpcIpv6Block was never passed, the Lambda subnets never got their
          # /64, and DualStackEnabled reported false while every function
          # asked for Ipv6AllowedForDualStack. All egress went out the NAT
          # instance. tests/test_ipv6_discovery.py runs this query against a
          # response built from botocore's own EC2 service model.
          _discover_ipv6() {
            aws ec2 describe-vpcs \
              --vpc-ids "${VPC_ID}" \
              --region "${AWS_REGION}" \
              --query 'Vpcs[0].Ipv6CidrBlockAssociationSet[?Ipv6CidrBlockState.State==`associated`] | [0].Ipv6CidrBlock' \
              --output text 2>/dev/null || echo ""
          }
          EFFECTIVE_IPV6=$(_discover_ipv6)
          [ "${EFFECTIVE_IPV6}" = "None" ] && EFFECTIVE_IPV6=""
          echo "VPC IPv6 CIDR: ${EFFECTIVE_IPV6:-<none yet — VpcIpv6CidrBlock will request one>}"

          # What the Lambda subnets already have. A subnet takes exactly one
          # IPv6 CIDR, so if one is associated, that is the only value this
          # template can carry for it -- proposing the /64 we would compute
          # is a *second* association, and EC2 refuses with "has reached the
          # limit of associated IPV6 CIDRs", rolling the stack back. Found by
          # tag rather than by stack output, so it works before the outputs
          # for this run exist.
          _subnet_ipv6() {
            aws ec2 describe-subnets \
              --region "${AWS_REGION}" \
              --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag:Name,Values=$1" \
              --query 'Subnets[0].Ipv6CidrBlockAssociationSet[?Ipv6CidrBlockState.State==`associated`] | [0].Ipv6CidrBlock' \
              --output text 2>/dev/null || echo ""
          }
          SUBNET_IPV6_AZ1=$(_subnet_ipv6 "${SHARED_STACK_NAME}-lambda-az1")
          SUBNET_IPV6_AZ2=$(_subnet_ipv6 "${SHARED_STACK_NAME}-lambda-az2")
          [ "${SUBNET_IPV6_AZ1}" = "None" ] && SUBNET_IPV6_AZ1=""
          [ "${SUBNET_IPV6_AZ2}" = "None" ] && SUBNET_IPV6_AZ2=""

          # Print the whole IPv6 picture. Every failure in this area so far has
          # been a mismatch between what the template assumed and what the VPC
          # actually holds, and none of it was visible in any log.
          echo "IPv6 state before deploy:"
          echo "  VPC /56 associations:"
          aws ec2 describe-vpcs --vpc-ids "${VPC_ID}" --region "${AWS_REGION}" \
            --query 'Vpcs[0].Ipv6CidrBlockAssociationSet[].[Ipv6CidrBlock,Ipv6CidrBlockState.State]' \
            --output text 2>/dev/null | sed 's/^/    /' || echo "    <none>"
          echo "  AZ1 subnet /64: ${SUBNET_IPV6_AZ1:-<none>}"
          echo "  AZ2 subnet /64: ${SUBNET_IPV6_AZ2:-<none>}"

          EFFECTIVE_IGW="${INTERNET_GATEWAY_ID}"
          if [ -z "${EFFECTIVE_IGW}" ]; then
            EFFECTIVE_IGW=$(aws ec2 describe-internet-gateways \
              --region "${AWS_REGION}" \
              --filters "Name=attachment.vpc-id,Values=${VPC_ID}" \
              --query 'InternetGateways[0].InternetGatewayId' \
              --output text 2>/dev/null || echo "")
            [ "${EFFECTIVE_IGW}" = "None" ] && EFFECTIVE_IGW=""
          fi
          echo "VPC Internet Gateway: ${EFFECTIVE_IGW:-<none found>}"

          PARAM_OVERRIDES="VpcId=${VPC_ID}"
          [ -n "${LAMBDA_SUBNET_CIDR_AZ1}" ] && PARAM_OVERRIDES="${PARAM_OVERRIDES} LambdaSubnetCidrAz1=${LAMBDA_SUBNET_CIDR_AZ1}"
          [ -n "${LAMBDA_SUBNET_CIDR_AZ2}" ] && PARAM_OVERRIDES="${PARAM_OVERRIDES} LambdaSubnetCidrAz2=${LAMBDA_SUBNET_CIDR_AZ2}"
          [ -n "${EFFECTIVE_IPV6}" ]         && PARAM_OVERRIDES="${PARAM_OVERRIDES} VpcIpv6Block=${EFFECTIVE_IPV6}"
          [ -n "${SUBNET_IPV6_AZ1}" ]        && PARAM_OVERRIDES="${PARAM_OVERRIDES} LambdaSubnetIpv6CidrAz1=${SUBNET_IPV6_AZ1}"
          [ -n "${SUBNET_IPV6_AZ2}" ]        && PARAM_OVERRIDES="${PARAM_OVERRIDES} LambdaSubnetIpv6CidrAz2=${SUBNET_IPV6_AZ2}"
          [ -n "${EFFECTIVE_IGW}" ]          && PARAM_OVERRIDES="${PARAM_OVERRIDES} InternetGatewayId=${EFFECTIVE_IGW}"

          sam deploy \
            --template-file shared.yaml \
            --stack-name "${SHARED_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --s3-prefix "${SHARED_STACK_NAME}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides ${PARAM_OVERRIDES}

          # Two-pass: if the VPC had no IPv6 CIDR before this deploy, VpcIpv6CidrBlock
          # just created one. Re-deploy immediately with the newly assigned CIDR so
          # Lambda subnets get their /64 CIDRs in the same CI run.
          if [ -z "${EFFECTIVE_IPV6}" ]; then
            NEWLY_ASSIGNED=$(_discover_ipv6)
            [ "${NEWLY_ASSIGNED}" = "None" ] && NEWLY_ASSIGNED=""
            if [ -n "${NEWLY_ASSIGNED}" ]; then
              echo "IPv6 CIDR newly assigned: ${NEWLY_ASSIGNED} — re-deploying to activate dual-stack subnets."
              sam deploy \
                --template-file shared.yaml \
                --stack-name "${SHARED_STACK_NAME}" \
                --region "${AWS_REGION}" \
                --capabilities CAPABILITY_NAMED_IAM \
                --resolve-s3 \
                --s3-prefix "${SHARED_STACK_NAME}" \
                --no-confirm-changeset \
                --no-fail-on-empty-changeset \
                --parameter-overrides "${PARAM_OVERRIDES} VpcIpv6Block=${NEWLY_ASSIGNED}"
            fi
          fi

      - name: Fetch Shared Stack Outputs
        run: |
          SHARED_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${SHARED_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output json)

          get_output() {
            echo "${SHARED_OUTPUTS}" | python3 -c \
              "import json,sys; d={o['OutputKey']:o['OutputValue'] for o in json.load(sys.stdin)}; print(d.get('$1',''))"
          }

          OBSERVATORY_METRICS_TABLE_NAME=$(get_output ObservatoryMetricsTableName)
          OBSERVATORY_METRICS_TABLE_ARN=$(get_output ObservatoryMetricsTableArn)
          AMP_WORKSPACE_ARN=$(get_output AMPWorkspaceArn)
          AMP_WORKSPACE_ID=$(get_output AMPWorkspaceId)
          LAMBDA_SUBNET_IDS=$(get_output LambdaSubnetIds)
          S3_VPCE_ID=$(get_output S3VpcEndpointId)
          DYNAMODB_VPCE_ID=$(get_output DynamoDbVpcEndpointId)
          EIGW_ID=$(get_output EgressOnlyInternetGatewayId)
          NAT_INSTANCE_ID=$(get_output NatInstanceId)
          IPV6_EGRESS_ENABLED=$(get_output Ipv6EgressEnabled)
          DUAL_STACK_ENABLED=$(get_output DualStackEnabled)
          VPC_IPV6_BLOCK_OUT=$(get_output VpcIpv6Block)

          if [ -z "${OBSERVATORY_METRICS_TABLE_NAME}" ] || [ -z "${AMP_WORKSPACE_ID}" ]; then
            echo "ERROR: Required outputs missing from shared stack ${SHARED_STACK_NAME}"
            exit 1
          fi

          echo "OBSERVATORY_METRICS_TABLE_NAME=${OBSERVATORY_METRICS_TABLE_NAME}" >> $GITHUB_ENV
          echo "OBSERVATORY_METRICS_TABLE_ARN=${OBSERVATORY_METRICS_TABLE_ARN}"   >> $GITHUB_ENV
          echo "AMP_WORKSPACE_ARN=${AMP_WORKSPACE_ARN}"                           >> $GITHUB_ENV
          echo "AMP_WORKSPACE_ID=${AMP_WORKSPACE_ID}"                             >> $GITHUB_ENV
          echo "LAMBDA_SUBNET_IDS=${LAMBDA_SUBNET_IDS}"                           >> $GITHUB_ENV
          echo "S3_VPCE_ID=${S3_VPCE_ID}"                                         >> $GITHUB_ENV
          echo "DYNAMODB_VPCE_ID=${DYNAMODB_VPCE_ID}"                             >> $GITHUB_ENV
          echo "EIGW_ID=${EIGW_ID}"                                               >> $GITHUB_ENV
          echo "NAT_INSTANCE_ID=${NAT_INSTANCE_ID}"                               >> $GITHUB_ENV
          echo "IPV6_EGRESS_ENABLED=${IPV6_EGRESS_ENABLED}"                       >> $GITHUB_ENV
          echo "DUAL_STACK_ENABLED=${DUAL_STACK_ENABLED}"                         >> $GITHUB_ENV
          echo "VPC_IPV6_BLOCK_OUT=${VPC_IPV6_BLOCK_OUT}"                         >> $GITHUB_ENV

          echo "Shared stack outputs fetched:"
          echo "  ObservatoryMetricsTableName      = ${OBSERVATORY_METRICS_TABLE_NAME}"
          echo "  AMPWorkspaceId                   = ${AMP_WORKSPACE_ID}"
          echo "  LambdaSubnetIds                  = ${LAMBDA_SUBNET_IDS:-<not created>}"
          echo "  S3VpcEndpointId                  = ${S3_VPCE_ID:-<not created>}"
          echo "  DynamoDbVpcEndpointId            = ${DYNAMODB_VPCE_ID:-<not created>}"
          echo "  EgressOnlyInternetGatewayId      = ${EIGW_ID:-<not created>}"
          echo "  NatInstanceId                    = ${NAT_INSTANCE_ID:-<not created>}"
          echo "  Ipv6EgressEnabled                = ${IPV6_EGRESS_ENABLED}"
          echo "  DualStackEnabled                 = ${DUAL_STACK_ENABLED}"
          echo "  VpcIpv6Block                     = ${VPC_IPV6_BLOCK_OUT:-<not yet assigned — set VPC_IPV6_BLOCK after first deploy>}"

      - name: Check the VPC's only IPv4 path out
        # Every Bedrock service is IPv4-only from this VPC, and this one NAT
        # instance is the whole route. When it is not running, every agent
        # turn fails with a connect timeout that reads like a slow service.
        # Nothing watched it, so nothing said so.
        run: |
          if [ -z "${NAT_INSTANCE_ID}" ]; then
            echo "::warning::No NAT instance, so the Lambda subnets have no IPv4 egress. Every Bedrock call will connect-timeout."
            exit 0
          fi
          NAT_STATE=$(aws ec2 describe-instances \
            --instance-ids "${NAT_INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || echo "unknown")
          echo "NAT instance ${NAT_INSTANCE_ID}: ${NAT_STATE}"
          if [ "${NAT_STATE}" != "running" ]; then
            echo "::error::The NAT instance is ${NAT_STATE}, not running. It is the only IPv4 route out of the Lambda subnets, so every Bedrock call -- including every AgentCore agent turn -- will fail with a connect timeout."
            aws ec2 start-instances --instance-ids "${NAT_INSTANCE_ID}" --region "${AWS_REGION}" >/dev/null 2>&1 \
              && echo "::notice::Asked it to start; it needs a moment before traffic flows." \
              || echo "::warning::Could not start it from here."
            exit 1
          fi

      - name: Fetch SIWE Authorizer ARN from siwe-infra stack
        run: |
          SIWE_AUTHORIZER_FUNCTION_ARN=$(aws cloudformation describe-stacks \
            --stack-name siwe-infra \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerFunctionArn'].OutputValue" \
            --output text)
          if [ -z "${SIWE_AUTHORIZER_FUNCTION_ARN}" ]; then
            echo "ERROR: AuthorizerFunctionArn not found in siwe-infra stack outputs"
            exit 1
          fi
          echo "SIWE_AUTHORIZER_FUNCTION_ARN=${SIWE_AUTHORIZER_FUNCTION_ARN}" >> $GITHUB_ENV
          echo "Fetched SIWE authorizer ARN: ${SIWE_AUTHORIZER_FUNCTION_ARN}"

      - name: Package the AgentCore agent
        # No longer optional: AgentCore is the substrate, and the Runtime
        # resource cannot create without this artifact. Failing here stops the
        # deploy before CloudFormation tries and rolls back.
        run: |
          CONFIG_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ConfigBucket'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -z "$CONFIG_BUCKET" ] || [ "$CONFIG_BUCKET" = "None" ]; then
            echo "Config bucket not resolvable yet; skipping (first deploy)."
            exit 0
          fi
          # Kept current on every deploy even while EnableAgentCore is false,
          # so turning the parameter on does not also require a code push.
          # Flat at the zip root: the entrypoint is a file the runtime
          # imports, so app.py and agent.py sit beside their dependencies
          # rather than inside a package the runtime has no reason to know.
          #
          # Two trees, because one cannot do both jobs. AgentCore runtimes are
          # Linux ARM64 and this runner is x86-64, so the shipped tree must be
          # resolved for aarch64 -- bedrock-agentcore pulls in pydantic_core
          # and websockets.speedups, both compiled. A plain `pip install
          # --target` here produced x86-64 wheels, and the runtime refused to
          # start: "Your artifact contains binary files that are incompatible
          # with Linux ARM64." But aarch64 wheels cannot be imported on this
          # runner, so the boot check needs a native tree of its own.
          rm -rf .agentcore-build .agentcore-check
          mkdir -p .agentcore-build .agentcore-check
          cp src/agentcore/app.py src/agentcore/agent.py .agentcore-build/
          cp src/agentcore/app.py src/agentcore/agent.py .agentcore-check/

          # The tree that ships. --only-binary=:all: because with --platform
          # pip cannot build from source anyway, and a silent sdist fallback
          # would put this runner's architecture back in the zip.
          pip install --quiet --target .agentcore-build \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            bedrock-agentcore
          # Read the ELF header of every compiled extension rather than
          # trusting the wheel's filename.
          python3 scripts/check_arm64_artifact.py .agentcore-build --expect aarch64

          # The tree that proves the entrypoint boots. A runtime that cannot
          # start is otherwise only discovered at the first invocation, long
          # after the deploy reports success.
          pip install --quiet --target .agentcore-check bedrock-agentcore
          (cd .agentcore-check && python3 -c "import app; assert hasattr(app,'app'), 'entrypoint exposes no ASGI app'; assert callable(getattr(app,'invoke',None)), 'entrypoint has no invoke'; print('entrypoint imports and exposes app')")

          (cd .agentcore-build && zip -qr ../agentcore-app.zip .)
          aws s3 cp agentcore-app.zip "s3://${CONFIG_BUCKET}/agentcore/app.zip" --region "${AWS_REGION}"
          echo "Uploaded agent code to s3://${CONFIG_BUCKET}/agentcore/app.zip"

      - name: SAM Deploy
        run: |
          # Captured before the cd: this step runs from infra/, so any path to
          # a repo-root file has to be absolute. A relative `scripts/...` here
          # resolves to infra/scripts/... and dies at run time with
          # "can't open file", after the deploy has already started.
          REPO_ROOT="${GITHUB_WORKSPACE:-$PWD}"
          cd infra
          ASSUME_ROLE_NAME="${ASSUME_ROLE_ARN##*/}"

          # Build parameter overrides — omit optional params when empty so SAM
          # doesn't receive "Key=" which it rejects as invalid.
          PARAM_OVERRIDES=(
            # Must be passed explicitly. `sam deploy` sends UsePreviousValue=true
            # for any parameter absent from --parameter-overrides, so changing
            # the template Default does nothing to a stack that already exists:
            # EnableAgentCore stayed at the old "false" through three green
            # deploys, the AgentCoreEnabled condition never fired, and the
            # functions kept AGENT_RUNTIME=classic with an empty
            # AGENTCORE_RUNTIME_ARN -- while the workflow, reading its own env,
            # skipped Classic provisioning. Nothing failed, because nothing was
            # attempted.
            "EnableAgentCore=${ENABLE_AGENTCORE}"
            "TeamConfigPrefix=${TEAM_CONFIG_PREFIX}"
            "VectorDbTable=${VECTOR_DB_TABLE}"
            "GeminiSecretArn=${GEMINI_SECRET_ARN}"
            "SamDeployerRoleName=${SAM_DEPLOYER_ROLE_NAME}"
            "SamAssumeRoleName=${ASSUME_ROLE_NAME}"
            "SiweAuthorizerFunctionArn=${SIWE_AUTHORIZER_FUNCTION_ARN}"
            "SharedStackName=${SHARED_STACK_NAME}"
            "ObservatoryMetricsTableName=${OBSERVATORY_METRICS_TABLE_NAME}"
            "ObservatoryMetricsTableArn=${OBSERVATORY_METRICS_TABLE_ARN}"
            "AMPWorkspaceArn=${AMP_WORKSPACE_ARN}"
            "AMPWorkspaceId=${AMP_WORKSPACE_ID}"
          )

          # The visibility team declares rag.mode=contextweave, and
          # config_loader._validate_rag *refuses* to load a team asking for it
          # with no URL rather than degrading -- a team running ungrounded
          # while reporting success is the failure that rule exists to stop.
          # So this must resolve, and it must resolve here rather than at
          # smoke-test time where the cause would be three layers away.
          #
          # Read from ContextWeave's own APIEndpoint output, never hardcoded.
          # One named stack rather than a list of candidates: falling back to
          # a dev stack when prod is missing would point the live pipeline at
          # a different knowledge layer and still report success, which is the
          # same silent-wrong-source failure this whole section is about.
          CONTEXTWEAVE_URL=$(aws cloudformation describe-stacks \
            --stack-name "${CONTEXTWEAVE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='APIEndpoint'].OutputValue" \
            --output text 2>/dev/null || true)
          [ "${CONTEXTWEAVE_URL}" = "None" ] && CONTEXTWEAVE_URL=""
          if [ -z "${CONTEXTWEAVE_URL}" ]; then
            # stdout, not stderr: GitHub parses workflow commands from stdout
            # only, so an annotation written to stderr renders nowhere and is
            # readable only by paging the job log. One line, because that is
            # what an annotation is.
            echo "::error::No APIEndpoint output on stack ${CONTEXTWEAVE_STACK_NAME}. The visibility team declares rag.mode=contextweave, so every run would be refused at config load. Deploy ContextWeave, correct CONTEXTWEAVE_STACK_NAME, or set globals.rag.mode to a mode this stack can serve."
            exit 1
          fi
          echo "ContextWeave URL from ${CONTEXTWEAVE_STACK_NAME}: ${CONTEXTWEAVE_URL}"
          PARAM_OVERRIDES+=("ContextWeaveUrl=${CONTEXTWEAVE_URL}")

          # The health documents live in ContextWeave. HealthDocsBucketName is
          # that stack's output — the bucket name; it publishes no ARN — and
          # KMSKeyArn is the key the bucket is encrypted with. Same
          # describe-stacks read as APIEndpoint above, and the same rule: do
          # not invent a bucket name here. Unlike the URL, a missing health
          # output does not fail the deploy. The health surface is optional;
          # the visibility team's RAG mode is not. An empty value is still
          # *sent*, because sam deploy otherwise reuses the previous value
          # and a bucket that no longer exists would keep being indexed.
          HEALTH_DOCS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${CONTEXTWEAVE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='HealthDocsBucketName'].OutputValue" \
            --output text 2>/dev/null || true)
          [ "${HEALTH_DOCS_BUCKET}" = "None" ] && HEALTH_DOCS_BUCKET=""
          HEALTH_DOCS_KMS=$(aws cloudformation describe-stacks \
            --stack-name "${CONTEXTWEAVE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='KMSKeyArn'].OutputValue" \
            --output text 2>/dev/null || true)
          [ "${HEALTH_DOCS_KMS}" = "None" ] && HEALTH_DOCS_KMS=""
          if [ -z "${HEALTH_DOCS_BUCKET}" ]; then
            echo "::warning::No HealthDocsBucketName output on stack ${CONTEXTWEAVE_STACK_NAME}. The health knowledge base is not created. That output exists when ContextWeave creates its health bucket."
          elif [ -z "${HEALTH_DOCS_KMS}" ]; then
            echo "::warning::Stack ${CONTEXTWEAVE_STACK_NAME} published HealthDocsBucketName but no KMSKeyArn. The health bucket is encrypted with that key, so the knowledge base is not created."
          else
            echo "Health docs bucket from ${CONTEXTWEAVE_STACK_NAME}: ${HEALTH_DOCS_BUCKET}"
          fi
          PARAM_OVERRIDES+=("HealthDocsBucketName=${HEALTH_DOCS_BUCKET}")
          PARAM_OVERRIDES+=("HealthDocsKmsKeyArn=${HEALTH_DOCS_KMS}")

          # The weave systems that are MCP servers, as AgentCore Gateway
          # targets. Resolved from each sibling's own stack output, never
          # hardcoded -- same rule as the ContextWeave URL above.
          #
          # Optional, unlike that one: a missing sibling means one tool fewer,
          # not a run that cannot start, so these warn rather than fail. They
          # are never silent either -- the gateway existed with a target
          # gated on a parameter nothing passed, so it had nothing behind it
          # and no signal said so.
          #
          # `stack:output:suffix` -- ScreenWeave already publishes the /mcp
          # path in its output; the others publish a base URL, and
          # ToolWeave's own DataDictionary client shows the convention
          # (base.rstrip("/") + "/mcp").
          #
          # Each name is read from that sibling's own CI workflow -- the thing
          # that actually creates the stack. They share no convention:
          #   screenweave               .github/workflows/deploy.yaml:
          #                             STACK_NAME: screenweave
          #   cipherweave-prod          cipherweave-${{ inputs.stage || 'prod' }}
          #   data-dictionary-mcp-prod  data-dictionary-mcp-${STAGE:-prod}
          #   toolweave                 samconfig, unsuffixed
          #
          # Read the sibling's workflow, not its samconfig or its deploy.sh.
          # Three of these were guessed from a local default and two were
          # wrong: DataDictionary's samconfig says "data-dictionary-mcp" while
          # its CI appends the stage, and ScreenWeave's deploy.sh derives
          # "screenweave-${ENV}" while its CI pins STACK_NAME outright. A local
          # default is what someone gets running the script by hand; it is not
          # evidence of what is deployed.
          MCP_WIRED=()
          MCP_MISSING=()
          for spec in \
            "screenweave:McpEndpoint::ScreenWeaveMcpEndpoint" \
            "cipherweave-prod:CipherWeaveApiEndpoint:/mcp:CipherWeaveMcpEndpoint" \
            "data-dictionary-mcp-prod:DataDictionaryFunctionUrl:/mcp:DataDictionaryMcpEndpoint" \
            "toolweave:ToolWeaveApiEndpoint:/mcp:ToolWeaveMcpEndpoint"; do
            mcp_stack="${spec%%:*}"; rest="${spec#*:}"
            mcp_output="${rest%%:*}"; rest="${rest#*:}"
            mcp_suffix="${rest%%:*}"; mcp_param="${rest#*:}"

            # Two failures that look identical in the log but are different
            # bugs: a stack name that does not exist (wrong guess, or the
            # sibling was never deployed) and a stack that exists but has no
            # such output (wrong output key, or the sibling stopped publishing
            # it). Reported as one "did not resolve" they cost a round trip to
            # a human; separated they name their own fix.
            mcp_stack_json=$(aws cloudformation describe-stacks \
              --stack-name "${mcp_stack}" \
              --region "${AWS_REGION}" \
              --output json 2>/dev/null) || mcp_stack_json=""

            if [ -z "${mcp_stack_json}" ]; then
              # Name the stacks that do exist and look close, so a wrong guess
              # is fixed from this log rather than from a later question.
              mcp_prefix="${mcp_stack%%-*}"
              mcp_near=$(aws cloudformation list-stacks \
                --region "${AWS_REGION}" \
                --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE \
                --query "StackSummaries[?starts_with(StackName, \`${mcp_prefix}\`)].StackName" \
                --output text 2>/dev/null | tr '\t' ' ') || mcp_near=""
              if [ -n "${mcp_near}" ]; then
                MCP_MISSING+=("${mcp_param%McpEndpoint} (no stack '${mcp_stack}'; found: ${mcp_near})")
              else
                MCP_MISSING+=("${mcp_param%McpEndpoint} (no stack '${mcp_stack}', and none named ${mcp_prefix}* — not deployed)")
              fi
              continue
            fi

            mcp_url=$(printf '%s' "${mcp_stack_json}" \
              | python -c "import json,sys;o=json.load(sys.stdin)['Stacks'][0].get('Outputs') or [];print(next((x['OutputValue'] for x in o if x['OutputKey']=='${mcp_output}'),''))" 2>/dev/null) || mcp_url=""

            if [ -n "${mcp_url}" ]; then
              mcp_url="${mcp_url%/}${mcp_suffix}"

              # Resolving the URL is not enough. AgentCore handshakes the
              # server while *creating* the target, so a server that refuses
              # the MCP handshake fails CloudFormation and rolls the whole
              # stack back -- the opposite of the "one tool fewer" degradation
              # everything else here is built for. Exit 1 means the server
              # answered with a revision it prefers over ours, which is the
              # refusal the Gateway acts on; exit 2 means the probe could not
              # tell, and wires it anyway (see the script).
              # `|| mcp_probe=$?` rather than reading $? on the next line:
              # the step runs under `bash -e`, so a bare command returning
              # non-zero ends the script before anything can inspect it. The
              # probe reports its outcome *as* its exit code, so every run
              # that was not `ok` killed the deploy -- including the
              # `unverified` case that exists precisely not to.
              mcp_probe=0
              python "${REPO_ROOT}/scripts/mcp_handshake.py" "${mcp_url}" --name "${mcp_param%McpEndpoint}" || mcp_probe=$?
              if [ ${mcp_probe} -eq 1 ]; then
                MCP_MISSING+=("${mcp_param%McpEndpoint} (MCP handshake refused; wiring it would fail the stack, not lose a tool)")
                continue
              fi

              PARAM_OVERRIDES+=("${mcp_param}=${mcp_url}")
              MCP_WIRED+=("${mcp_param%McpEndpoint}")
            else
              mcp_keys=$(printf '%s' "${mcp_stack_json}" \
                | python -c "import json,sys;o=json.load(sys.stdin)['Stacks'][0].get('Outputs') or [];print(' '.join(x['OutputKey'] for x in o))" 2>/dev/null) || mcp_keys=""
              MCP_MISSING+=("${mcp_param%McpEndpoint} (stack '${mcp_stack}' exists but publishes no '${mcp_output}'; it has: ${mcp_keys:-none})")
            fi
          done

          if [ ${#MCP_WIRED[@]} -gt 0 ]; then
            echo "::notice::Gateway targets wired: ${MCP_WIRED[*]}"
          else
            echo "::warning::No MCP gateway targets resolved. The AgentCore gateway will be created with nothing behind it, which is infrastructure for nothing."
          fi
          for missing in "${MCP_MISSING[@]}"; do
            echo "::warning::No MCP endpoint for ${missing}. That tool is absent from the gateway; every other target is unaffected."
          done
          [ -n "${LAMBDA_SUBNET_IDS}" ]            && PARAM_OVERRIDES+=("LambdaSubnetIds=${LAMBDA_SUBNET_IDS}")
          [ -n "${S3_VPCE_ID}" ]                   && PARAM_OVERRIDES+=("S3VpcEndpointId=${S3_VPCE_ID}")
          [ -n "${DYNAMODB_VPCE_ID}" ]             && PARAM_OVERRIDES+=("DynamoDbVpcEndpointId=${DYNAMODB_VPCE_ID}")
          [ -n "${NAT_INSTANCE_ID}" ]              && PARAM_OVERRIDES+=("NatInstanceId=${NAT_INSTANCE_ID}")
          [ -n "${DUAL_STACK_ENABLED}" ]            && PARAM_OVERRIDES+=("DualStackEnabled=${DUAL_STACK_ENABLED}")

          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"

      - name: Sync the health knowledge base
        # Objects already in the bucket are not an S3 event, so the rule that
        # re-indexes later uploads does not cover them. Starting one job here
        # reads what is there now. A failure is a warning: model access is
        # granted in the Bedrock console, and a missing grant must not roll
        # back a stack whose data source is already pointed at the right bucket.
        run: |
          KB_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='HealthKnowledgeBaseId'].OutputValue" \
            --output text 2>/dev/null || true)
          DS_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='HealthDataSourceId'].OutputValue" \
            --output text 2>/dev/null || true)
          [ "${KB_ID}" = "None" ] && KB_ID=""
          [ "${DS_ID}" = "None" ] && DS_ID=""
          if [ -z "${KB_ID}" ] || [ -z "${DS_ID}" ]; then
            echo "::warning::No health knowledge base on this stack. ContextWeave published no health bucket, so nothing was indexed."
            exit 0
          fi
          aws bedrock-agent start-ingestion-job \
            --region "${AWS_REGION}" \
            --knowledge-base-id "${KB_ID}" \
            --data-source-id "${DS_ID}" \
            || echo "::warning::Could not start ingestion for knowledge base ${KB_ID}. Grant twelvelabs.marengo-embed-3-0-v1:0 in the Bedrock console and start the job. The data source is already ContextWeave's health bucket."

      - name: Smoke-test the AgentCore runtime
        # A green deploy says CloudFormation created the runtime. It does not
        # say the program inside it boots, so this invokes it once for real.
        # Every way the artifact can be wrong -- no ASGI app, missing SDK, an
        # execution role that cannot reach Bedrock -- fails at the first
        # invocation and nowhere earlier.
        if: env.ENABLE_AGENTCORE == 'true'
        run: |
          RUNTIME_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AgentCoreRuntimeArn'].OutputValue" \
            --output text)
          if [ -z "${RUNTIME_ARN}" ] || [ "${RUNTIME_ARN}" = "None" ]; then
            echo "AgentCore is enabled but the stack published no AgentCoreRuntimeArn." >&2
            exit 1
          fi
          echo "Invoking ${RUNTIME_ARN}"
          python3 scripts/agentcore_smoke.py --runtime-arn "${RUNTIME_ARN}" --region "${AWS_REGION}"

          # And every per-team runtime. Smoking only the shared one proved the
          # artifact boots somewhere while leaving the runtimes that actually
          # serve traffic untried -- which is how a pipeline failed five
          # minutes later with nothing but "Worker task failed" to go on.
          TEAM_ARNS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AgentCoreTeamRuntimeArns'].OutputValue" \
            --output text)
          if [ -z "${TEAM_ARNS}" ] || [ "${TEAM_ARNS}" = "None" ]; then
            echo "::warning::The stack published no per-team runtimes, so every team falls back to the shared one."
          else
            # Process substitution, not a pipe: `... | while` runs the loop in
            # a subshell, where a failing runtime need not fail the step. A
            # check that cannot fail is worse than no check.
            RUNTIME_FAILURES=0
            while IFS=$'\t' read -r team arn; do
              echo "Invoking ${team}: ${arn}"
              python3 scripts/agentcore_smoke.py --runtime-arn "${arn}" --region "${AWS_REGION}" \
                || RUNTIME_FAILURES=$((RUNTIME_FAILURES + 1))
            done < <(echo "${TEAM_ARNS}" | python3 -c 'import json,sys; [print(f"{k}\t{v}") for k,v in json.load(sys.stdin).items()]')
            if [ "${RUNTIME_FAILURES}" -ne 0 ]; then
              # stdout: GitHub parses workflow commands from stdout only, so an
              # annotation written to stderr never appears.
              echo "::error::${RUNTIME_FAILURES} per-team AgentCore runtime(s) did not answer. Every pipeline on those teams would fail with nothing but 'Worker task failed'."
              exit 1
            fi
          fi

      - name: Sync team configs to S3
        run: |
          CONFIG_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ConfigBucket'].OutputValue" \
            --output text)
          # Not `aws s3 sync`: that overwrote the same key provisioning writes
          # agentId/aliasId back into, so every deploy wiped the ids and forced
          # a full rebuild of every agent. The repository owns definitions; S3
          # owns the runtime identifiers.
          CONFIG_BUCKET="$CONFIG_BUCKET" python3 scripts/sync_team_configs.py \
            --root config/examples/teams \
            --prefix "${TEAM_CONFIG_PREFIX}" \
            --region "${AWS_REGION}"

      - name: Register agents and AgentCore release channels
        # After the config sync, because it writes the runtime ARN back into
        # the same S3 object the sync merges -- running it first would hand the
        # sync a runtime identity it then had to preserve, instead of one it
        # simply carries.
        #
        # Endpoints created here are release channels, a fixed handful. Agent
        # identity rides on the span (gen_ai.agent.id), not on an endpoint
        # each: AgentCore's ten-per-runtime quota is a release budget, and
        # spending it on identity does not scale and leaves nothing for the
        # shadow channel the DPO flywheel needs.
        if: env.ENABLE_AGENTCORE == 'true'
        run: |
          # One query per output. A single multi-key filter returns values in
          # the stack's own output order, not the order they are read into, so
          # the runtime id and the bucket can silently swap places.
          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          RUNTIME_ID=$(stack_output AgentCoreRuntimeId)
          RUNTIME_VERSION=$(stack_output AgentCoreRuntimeVersion)
          RUNTIME_ARN=$(stack_output AgentCoreRuntimeArn)
          CONFIG_BUCKET=$(stack_output ConfigBucket)
          # Each agent records its *own team's* runtime. Stamping the shared
          # one shadows the per-team routing, because the worker resolves an
          # agent's runtimeArn before its team's.
          TEAM_RUNTIME_ARNS=$(stack_output AgentCoreTeamRuntimeArns)
          for name in RUNTIME_ID RUNTIME_VERSION RUNTIME_ARN CONFIG_BUCKET; do
            value="${!name}"
            if [ -z "${value}" ] || [ "${value}" = "None" ]; then
              echo "The stack published no value for ${name} -- cannot register agents." >&2
              exit 1
            fi
          done
          python3 scripts/register_agents.py \
            --runtime-id "${RUNTIME_ID}" \
            --runtime-arn "${RUNTIME_ARN}" \
            --runtime-version "${RUNTIME_VERSION}" \
            --team-runtime-arns "${TEAM_RUNTIME_ARNS}" \
            --bucket "${CONFIG_BUCKET}" \
            --prefix "${TEAM_CONFIG_PREFIX}" \
            --region "${AWS_REGION}"

      - name: Report which image models this account can call
        # Informational, never a gate. Two deploys were spent guessing ids --
        # one real but inaccessible, one that does not exist -- and the
        # account can answer both. A DNS blip or a missing
        # bedrock:ListFoundationModels grant must not redden a deploy.
        continue-on-error: true
        run: |
          python3 scripts/image_models.py --region "${AWS_REGION}" || true

      - name: Run one real team pipeline
        run: |
          STATE_MACHINE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='StateMachineArn'].OutputValue" \
            --output text)
          if [ -z "${STATE_MACHINE_ARN}" ] || [ "${STATE_MACHINE_ARN}" = "None" ]; then
            echo "::error::The stack published no StateMachineArn, so no pipeline can run." >&2
            exit 1
          fi
          python3 scripts/pipeline_smoke.py \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --region "${AWS_REGION}"

      - name: Sync roles and departments to S3
        run: |
          CONFIG_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ConfigBucket'].OutputValue" \
            --output text)
          echo "Uploading roles.json and departments.json → s3://${CONFIG_BUCKET}/"
          aws s3 cp config/examples/roles.json \
            "s3://${CONFIG_BUCKET}/roles.json" \
            --region "${AWS_REGION}"
          aws s3 cp config/examples/departments.json \
            "s3://${CONFIG_BUCKET}/departments.json" \
            --region "${AWS_REGION}"

      - name: Provision team agents
        # Classic only. This invokes ProvisionTeamFunction, which calls
        # Bedrock CreateAgent and writes agentId/aliasId back into team.json.
        # An agent on AgentCore has no equivalent step: its runtime is an
        # AWS::BedrockAgentCore::Runtime created by this same template, and
        # its runtimeArn is a stack output rather than something a Lambda
        # provisions. So this step is skipped once the substrate flips, and
        # leaving it running would rebuild Classic agents nothing invokes.
        if: env.ENABLE_AGENTCORE != 'true'
        env:
          # Provisioning walks every team and creates any missing Bedrock
          # agents. It takes minutes, so it is not something to hold an HTTP
          # connection open for: a 60s CLI read timeout made botocore retry
          # and fire three concurrent provisioning runs, and simply raising
          # the timeout then hit "Connection was closed before we received a
          # valid response" at ~263s when an intermediary dropped the idle
          # socket. Both are the same mistake -- a long job invoked
          # synchronously. So: fire it asynchronously and poll for the result,
          # the way every other long operation on this platform works.
          AWS_MAX_ATTEMPTS: "1"
          POLL_TIMEOUT_SECONDS: "840"
          POLL_INTERVAL_SECONDS: "20"
        run: |
          PROVISION_FUNCTION_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProvisionTeamFunctionArn'].OutputValue" \
            --output text)

          echo "Invoking ProvisionTeamFunction asynchronously: ${PROVISION_FUNCTION_ARN}"
          aws lambda invoke \
            --function-name "${PROVISION_FUNCTION_ARN}" \
            --region "${AWS_REGION}" \
            --invocation-type Event \
            --cli-binary-format raw-in-base64-out \
            --payload '{"httpMethod":"POST","path":"/teams","headers":{},"body":"{}","queryStringParameters":null}' \
            /dev/null

          # GET /teams recomputes `provisioned` per team from the config in
          # S3, which provisioning writes back as it goes, so it is a real
          # completion signal rather than a guess about elapsed time.
          poll_teams() {
            aws lambda invoke \
              --function-name "${PROVISION_FUNCTION_ARN}" \
              --region "${AWS_REGION}" \
              --cli-read-timeout 60 \
              --cli-binary-format raw-in-base64-out \
              --payload '{"httpMethod":"GET","path":"/teams","headers":{},"body":null,"queryStringParameters":null}' \
              teams_response.json >/dev/null
          }

          deadline=$(( $(date +%s) + POLL_TIMEOUT_SECONDS ))
          while :; do
            if poll_teams; then
              python3 - <<'PY' && break
          import json, sys
          body = json.load(open("teams_response.json")).get("body")
          teams = json.loads(body).get("teams", []) if body else []
          pending = [t["name"] for t in teams if not t.get("provisioned")]
          print(f"provisioned {len(teams) - len(pending)}/{len(teams)}"
                + (f"; waiting on {pending}" if pending else ""))
          sys.exit(1 if pending else 0)
          PY
            else
              echo "poll failed; retrying"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Provisioning did not finish within ${POLL_TIMEOUT_SECONDS}s."
              cat teams_response.json 2>/dev/null || true
              exit 1
            fi
            sleep "${POLL_INTERVAL_SECONDS}"
          done
          echo "All teams provisioned."
      - name: Dump CloudFormation events on failure
        if: failure()
        # Scoped to this run. Filtered only by status, the dump printed the
        # last three deploys' rollbacks into a log whose own deploy had
        # succeeded -- which reads exactly like the current run failing and
        # sends you to debug something already fixed. "No resource failed in
        # this run" is the useful answer when the deploy was fine.
        # A changeset that fails early validation never writes a stack
        # resource event, so the script also reads DescribeEvents and lists
        # FAILED change sets. That is the text that names the resource.
        run: |
          python3 scripts/dump_stack_failures.py \
            "${STACK_NAME}" "${SHARED_STACK_NAME}" "${BEDROCK_AGENTS_STACK_NAME}" \
            --since "${DEPLOY_STARTED_AT}" \
            --region "${AWS_REGION}"
