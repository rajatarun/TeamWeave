            Path: /agents
            Method: get
        AgentsDeleteEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /agents
            Method: delete
        AgentByNameGetEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /agents/{name}
            Method: get
            RequestParameters:
              - method.request.path.name:
                  Required: true
                  Caching: false
        AgentByNamePutEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /agents/{name}
            Method: put
            RequestParameters:
              - method.request.path.name:
                  Required: true
                  Caching: false
        TeamsGetEvent:
