  StatusFunction:
    Type: AWS::Serverless::Function
    DependsOn: StatusFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/status_handler.handler
      Role: !GetAtt StatusRole.Arn
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref StateMachine
      Events:
        TeamTaskStatusEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /team/task/{run_id}
            Method: get
            RequestParameters:
              - method.request.path.run_id:
                  Required: true
                  Caching: false
        TeamsTaskStatusEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /teams/task/{run_id}
            Method: get
            RequestParameters:
              - method.request.path.run_id:
                  Required: true
                  Caching: false
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue


  ProvisionTeamFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProvisionTeamFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: config/examples/lambda_handler.handler
      Role: !GetAtt ProvisionTeamRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 900
      Environment:
        Variables:
          ARTIFACT_BUCKET: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
          BEDROCK_ROLE_ARN: !Ref BedrockAgentServiceRoleArn
          SCAN_DIR: /var/task/config/examples
          ROLES_PATH: /var/task/config/examples/roles.json
          DEPTS_PATH: /var/task/config/examples/departments.json
          # Empty, and it has to be. The provisioner derives three keys from
          # it -- teams_prefix = "{OUTPUT_PREFIX}/teams", roles_key =
          # "{OUTPUT_PREFIX}/roles.json", departments_key likewise -- so
          # "teams" here meant it scanned s3://bucket/teams/teams/ for team
          # configs and looked for roles at teams/roles.json.
          #
          # The deploy writes team configs to teams/<name>/<version>/team.json
          # and roles.json / departments.json at the root, so every one of
          # those lookups missed and GET /teams returned {"teams": [], ...}
          # with a 200. The UI's team picker was empty with no error, and so
          # were the roles and departments tabs.
          #
          # tests/test_config_bucket_layout.py derives both sides -- where the
          # workflow writes, where the Lambda reads -- and compares them, so
          # the two cannot drift apart again in silence.
          OUTPUT_PREFIX: ""
          FOUNDATION_MODEL: deepseek.v3.2
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue

  SamDeployerStateMachinePermissions:
    Type: AWS::IAM::RolePolicy
    Condition: HasSamDeployerRoleName
    Properties:
      RoleName: !Ref SamDeployerRoleName
      PolicyName: !Sub "${AWS::StackName}-sam-deployer-stepfunctions"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowStateMachineManagement
            Effect: Allow
            Action:
              - states:CreateStateMachine
              - states:UpdateStateMachine
              - states:DeleteStateMachine
              - states:DescribeStateMachine
              - states:TagResource
              - states:UntagResource
            Resource:
              - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*"
          - Sid: AllowStateMachineDiscovery
            Effect: Allow
            Action:
              - states:ListStateMachines
            Resource: "*"
          - Sid: AllowGetRolePolicyForCfnDriftChecks
            Effect: Allow
            Action:
              - iam:GetRolePolicy
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${SamDeployerRoleName}"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-trigger-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-status-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-worker-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-provision-team-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-stepfunctions-role"

  SamAssumeRoleS3TeamUploadPermissions:
    Type: AWS::IAM::RolePolicy
    Condition: HasSamAssumeRoleName
    Properties:
      RoleName: !Ref SamAssumeRoleName
      PolicyName: !Sub "${AWS::StackName}-s3-team-upload"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !If
                - CreateConfigBucket
                - !GetAtt TeamConfigBucket.Arn
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
              - !If
                - CreateConfigBucket
                - !Sub "${TeamConfigBucket.Arn}/*"
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"

  SamAssumeRoleAgentCoreRegistryPermissions:
    Type: AWS::IAM::RolePolicy
    Condition: HasSamAssumeRoleName
    Properties:
      RoleName: !Ref SamAssumeRoleName
      PolicyName: !Sub "${AWS::StackName}-agentcore-registry"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The deploy registers one endpoint per TeamWeave agent against the
          # shared runtime, so it needs create/update/list on endpoints and
          # read on the runtime itself. Delete is deliberately absent: the
          # registry step never removes an endpoint, because an agent dropped
          # from a team config may still be addressed by a run in flight.
          - Sid: AllowAgentEndpointRegistry
            Effect: Allow
            Action:
              - bedrock-agentcore:CreateAgentRuntimeEndpoint
              - bedrock-agentcore:UpdateAgentRuntimeEndpoint
              - bedrock-agentcore:GetAgentRuntimeEndpoint
              - bedrock-agentcore:ListAgentRuntimeEndpoints
              - bedrock-agentcore:GetAgentRuntime
            Resource:
              - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
              - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*"

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${AWS::StackName}-state-machine"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsRole.Arn
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "InvokeWorker",
          "States": {
            "InvokeWorker": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${WorkerFunction.Arn}",
                "Payload.$": "$"
              },
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "WorkflowFailed"
                }
              ],
              "End": true
            },
            "WorkflowFailed": {
              "Type": "Fail",
              "Error": "WorkflowFailed",
              "Cause": "Worker task failed"
            }
          }
        }

  OrchestratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasVpcConfig
    Properties:
      GroupDescription: Lambda security group for outbound PostgreSQL access to RDS
      VpcId: !Ref VpcId

  OrchestratorToRdsEgress5432:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasVpcConfig
    Properties:
      GroupId: !Ref OrchestratorSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSecurityGroupId

  OrchestratorToAwsServicesEgress443:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasVpcConfig
    Properties:
      GroupId: !Ref OrchestratorSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: "0.0.0.0/0"

  # IPv6 egress: Lambda → AWS public endpoints via EIGW (no NAT Gateway required).
  # Covers Bedrock, Secrets Manager, AMP, and other dual-stack AWS services.
  OrchestratorToAwsServicesEgressIPv6443:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasVpcConfig
    Properties:
      GroupId: !Ref OrchestratorSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIpv6: "::/0"

  RdsIngressFromOrchestrator5432:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasVpcConfig
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref OrchestratorSecurityGroup

  # NOTE: S3 and DynamoDB Gateway VPC endpoints, Bedrock Interface VPC endpoints,
  # and the IPv6 EIGW route are now managed in the shared infrastructure stack
  # (infra/shared.yaml). They are shared resources that outlive application deploys.

  SiweAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasSiweAuthorizer
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SiweAuthorizerFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TeamWeaveApi}/authorizers/*"

  TeamWeaveWAF:
    Type: AWS::WAFv2::WebACL
    Condition: DeployWAF
    Properties:
      Name: !Sub "${AWS::StackName}-waf"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-common-rules"
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-bad-inputs"
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-waf"

  TeamWeaveWAFAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: DeployWAF
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${TeamWeaveApi}/stages/prod"
      WebACLArn: !GetAtt TeamWeaveWAF.Arn

  # GatewayResponse resources add CORS headers to 4xx/5xx responses that API Gateway
  # generates itself (e.g. 401 from the Lambda authorizer, 403 WAF block, 429 throttle).
  # Without these, auth failures return no Access-Control-Allow-Origin header and
  # browsers report the error as a CORS failure, masking the real cause.
  CorsGatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Ref AllowedCorsOrigin
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref TeamWeaveApi

  CorsGatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Ref AllowedCorsOrigin
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref TeamWeaveApi

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}/access-logs"
      RetentionInDays: 30

  TeamWeaveApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: SiweAuthorizer
        # Allow OPTIONS preflight requests to pass through without invoking the authorizer.
        # Without this, browsers' CORS preflight requests are rejected with 401 before
        # reaching the Lambda, breaking all cross-origin calls.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          SiweAuthorizer:
            FunctionArn: !Ref SiweAuthorizerFunctionArn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ReauthorizeEvery: 300
      Cors:
        AllowOrigin: !Ref AllowedCorsOrigin
        AllowHeaders: "'Content-Type,Authorization,x-api-key'"
        AllowMethods: "'OPTIONS,GET,POST,PUT,DELETE'"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","responseLatency":"$context.responseLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true

  # ── AgentCore substrate ────────────────────────────────────────────────────
  # Declared here rather than created by a script so the substrate is reviewed
  # and versioned like the rest of the stack. All of it is behind
  # EnableAgentCore, which defaults to false: these are billable, and the
  # runtime cannot create until its code artifact exists in the config bucket.
  # Flipping the parameter is what turns phases 2 and 5 on.

  AgentCoreRuntimeRole:
    Type: AWS::IAM::Role
    Condition: AgentCoreEnabled
    Properties:
      Description: Execution role for TeamWeave agents hosted on AgentCore Runtime.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: invoke-models-and-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The agent program's only job is to call a model, so this is
              # the whole of what it needs beyond writing its own logs.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"

  AgentCoreMemory:
    Type: AWS::BedrockAgentCore::Memory
    Condition: AgentCoreEnabled
    Properties:
      Name: !Ref AgentCoreMemoryName
      Description: >
        Session memory for agents on AgentCore. Deliberately separate from
        ContextWeave, which stays the knowledge layer: this holds what was
        said in a conversation, not what the platform knows.
      EventExpiryDuration: !Ref AgentCoreMemoryExpiryDays

  AgentCoreRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: AgentCoreEnabled
    Properties:
      AgentRuntimeName: !Ref AgentCoreRuntimeName
      Description: Hosts src/agentcore/app.py, the program one agent turn runs in.
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          # A zip, not a container: CreateAgentRuntime accepts either, and the
          # agent program is small enough that an ECR image would be overhead.
          Code:
            S3:
              Bucket: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
              Prefix: !Ref AgentCoreRuntimeCodePrefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - app.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        # Per-agent values are set per runtime; these are the defaults the
        # program falls back to, mirroring a Classic agent's own configuration.
        AGENT_MODEL_ID: !Ref AgentCoreDefaultModelId


  # ── One AgentCore runtime per team ─────────────────────────────────────────
  # A team is the deployment unit. One runtime for the whole platform put
  # every team's agents in one blast radius and one endpoint budget: release
  # channels are ten per runtime and shared, so two teams could not be
  # canaried independently and a bad version reached all of them at once.
  #
  # Not one per *agent*. That was tried: AWS's quota refused at twelve and was
  # right to, because endpoints are a release mechanism, not an identity axis.
  # Identity is a name in a document -- a skill id on the A2A card,
  # gen_ai.agent.id on the span -- and prompt_builder composes ROLE and
  # STEP_GOAL into each turn, so one runtime serves a team's agents without
  # them being confusable.
  #
  # AgentRuntimeName must match [a-zA-Z][a-zA-Z0-9_]{0,47}: no hyphens, which
  # is why these are named from the team rather than from ${AWS::StackName}.
  # tests/test_agentcore_infra.py walks every name property against that
  # pattern, and tests/test_team_runtimes.py fails when a team in
  # config/examples/teams has no runtime here.

  AgentCoreRuntimeTarunVisibilityTeam:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: AgentCoreEnabled
    Properties:
      AgentRuntimeName: "teamweave_tarun_visibility_team"
      Description: "AgentCore runtime serving every agent of tarun_visibility_team."
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
              Prefix: !Ref AgentCoreRuntimeCodePrefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - app.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AGENT_MODEL_ID: !Ref AgentCoreDefaultModelId
        # Which team's runtime this is, for the program's own logs and spans.
        AGENT_TEAM: "tarun_visibility_team"

  AgentCoreRuntimeDailyOperator:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: AgentCoreEnabled
    Properties:
      AgentRuntimeName: "teamweave_daily_operator"
      Description: "AgentCore runtime serving every agent of daily_operator."
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
              Prefix: !Ref AgentCoreRuntimeCodePrefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - app.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AGENT_MODEL_ID: !Ref AgentCoreDefaultModelId
        AGENT_TEAM: "daily_operator"

  AgentCoreRuntimeLinkedinQuickPost:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: AgentCoreEnabled
    Properties:
      AgentRuntimeName: "teamweave_linkedin_quick_post"
      Description: "AgentCore runtime serving every agent of linkedin_quick_post."
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
              Prefix: !Ref AgentCoreRuntimeCodePrefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - app.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AGENT_MODEL_ID: !Ref AgentCoreDefaultModelId
        AGENT_TEAM: "linkedin_quick_post"

  AgentCoreRuntimeJobHunter:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: AgentCoreEnabled
    Properties:
      AgentRuntimeName: "teamweave_job_hunter"
      Description: "AgentCore runtime serving every agent of job_hunter."
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
              Prefix: !Ref AgentCoreRuntimeCodePrefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - app.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AGENT_MODEL_ID: !Ref AgentCoreDefaultModelId
        AGENT_TEAM: "job_hunter"

  AgentCoreRuntimeHealthPrep:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: AgentCoreEnabled
    Properties:
      AgentRuntimeName: "teamweave_health_prep"
      Description: "AgentCore runtime serving every agent of health_prep. The worker retrieves from the health knowledge base before the turn; this runtime does not."
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
              Prefix: !Ref AgentCoreRuntimeCodePrefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - app.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AGENT_MODEL_ID: !Ref AgentCoreDefaultModelId
        AGENT_TEAM: "health_prep"

  AgentCoreRuntimeFinancialAdvisors:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: AgentCoreEnabled
    Properties:
      AgentRuntimeName: "teamweave_financial_advisors"
      Description: "AgentCore runtime serving every agent of financial_advisors. The worker retrieves the portfolio and the web before the turn; this runtime does not."
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
              Prefix: !Ref AgentCoreRuntimeCodePrefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - app.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AGENT_MODEL_ID: !Ref AgentCoreDefaultModelId
        AGENT_TEAM: "financial_advisors"

  # ── AgentCore Gateway ──────────────────────────────────────────────────────
  # Managed tool access for agents. AWS_IAM rather than CUSTOM_JWT: the
  # authorizer types include one that needs no external identity provider, and
  # introducing an IdP to reach a service the platform already owns would be
  # ceremony. The target is ScreenWeave, which already speaks MCP -- that is
  # the composability the platform was built for.

  AgentCoreGatewayRole:
    Type: AWS::IAM::Role
    Condition: AgentCoreEnabled
    Properties:
      Description: Role the AgentCore Gateway assumes to reach its targets.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: gateway-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"

  AgentCoreGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Condition: AgentCoreEnabled
    Properties:
      Name: !Ref AgentCoreGatewayName
      Description: Tool access for TeamWeave agents running on AgentCore.
      RoleArn: !GetAtt AgentCoreGatewayRole.Arn
      AuthorizerType: AWS_IAM

  # The weave systems that are MCP servers, as gateway targets. Only those
  # that speak MCP over *HTTP* can be one: a GatewayTarget takes an Endpoint,
  # so a stdio server has nothing to point at. DeployWeave is stdio
  # (`mcp.run()` with no transport) and is deliberately absent for that
  # reason, not by oversight.
  ScreenWeaveGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: ScreenWeaveTargetEnabled
    Properties:
      Name: screenweave
      Description: ScreenWeave's MCP server -- crawl, visual QA and showcase video.
      GatewayIdentifier: !GetAtt AgentCoreGateway.GatewayIdentifier
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !Ref ScreenWeaveMcpEndpoint

  CipherWeaveGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: CipherWeaveTargetEnabled
    Properties:
      Name: cipherweave
      Description: CipherWeave's MCP server -- secrets and gate integration.
      GatewayIdentifier: !GetAtt AgentCoreGateway.GatewayIdentifier
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !Ref CipherWeaveMcpEndpoint

  DataDictionaryGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: DataDictionaryTargetEnabled
    Properties:
      Name: datadictionary
      Description: DataDictionary's MCP server -- the platform's term and schema catalogue.
      GatewayIdentifier: !GetAtt AgentCoreGateway.GatewayIdentifier
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !Ref DataDictionaryMcpEndpoint

  ToolWeaveGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: ToolWeaveTargetEnabled
    Properties:
      Name: toolweave
      Description: ToolWeave's MCP server -- natural language to safe REST calls from OpenAPI specs.
      GatewayIdentifier: !GetAtt AgentCoreGateway.GatewayIdentifier
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !Ref ToolWeaveMcpEndpoint

  # ── Health knowledge base ──────────────────────────────────────────────────
  # The documents stay in ContextWeave's health bucket. HealthDocsBucketName
  # and HealthDocsKmsKeyArn are that stack's outputs, read at deploy time the
  # same way ContextWeaveUrl is. This section indexes that bucket for
  # health_prep. It does not create a second copy of the records.
  #
  # amazon.nova-2-multimodal-embeddings-v1:0 is a custom embedding on a
  # managed knowledge base: dimensions 1024 and embeddingDataType FLOAT32.
  # The modelConfiguration document is TwelveLabs Marengo's path, and
  # Marengo is the only model on it. A managed base owns the vector store,
  # so there is no S3 Vectors index to declare here.
  #
  # AWS::Bedrock::KnowledgeBase cannot express supplemental storage, which
  # a native multimodal model requires for extracted media.
  # HealthKbProvisionFunction calls CreateKnowledgeBase with that body.
  # Changing EmbeddingModelArn deletes the base and creates it again:
  # UpdateKnowledgeBase cannot change the embedding model.
  #
  # The multimodal bucket holds media extracted during ingestion. It is not
  # the document source. A bucket of its own keeps extracted files from being
  # ingested again as if they were records.

  HealthMultimodalBucket:
    Type: AWS::S3::Bucket
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      BucketName: !Sub "tw-health-mm-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  HealthKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      Description: Role the health knowledge base assumes to read ContextWeave's health bucket and write extracted media.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: health-registry-kb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-multimodal-embeddings-v1:0"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:${AWS::Partition}:s3:::${HealthDocsBucketName}"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${HealthDocsBucketName}/*"
              # Write access is only for the multimodal destination. The health
              # document bucket stays read-only: extracted media must not be
              # written back into the records ContextWeave owns.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt HealthMultimodalBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${HealthMultimodalBucket.Arn}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref HealthDocsKmsKeyArn

  # Not in the VPC. bedrock-agent is IPv4-only, and this function's
  # whole job is CreateKnowledgeBase. Putting it next to the worker would
  # make that call depend on the NAT instance.
  HealthKbProvisionRole:
    Type: AWS::IAM::Role
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      RoleName: !Sub "${AWS::StackName}-health-kb-provision-role"
      Description: Creates the managed health knowledge base. It cannot read the records.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: health-kb-provision
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The stack creates the group. CreateLogGroup on * is how a late
              # log line rebuilds /aws/lambda/<FunctionName> after a rollback
              # deletes it, and that rebuilt name is what the next changeset
              # refuses. Streams in the stack's own group are enough.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt HealthKbProvisionLogGroup.Arn
              # Create and list have no knowledge-base id yet. The rest name
              # the base this function just created.
              - Effect: Allow
                Action:
                  - bedrock:CreateKnowledgeBase
                  - bedrock:ListKnowledgeBases
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:UpdateKnowledgeBase
                  - bedrock:DeleteKnowledgeBase
                  - bedrock:CreateDataSource
                  - bedrock:GetDataSource
                  - bedrock:UpdateDataSource
                  - bedrock:DeleteDataSource
                  - bedrock:ListDataSources
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt HealthKnowledgeBaseRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock.amazonaws.com

  # No LogGroupName, and no FunctionName. Both are the names a rolled-back
  # create leaves behind. The provision function ran, CloudFormation deleted
  # it, then deleted /aws/lambda/<FunctionName>; a log line still in flight
  # creates that group again, and it is not in the stack. The next changeset
  # is an Add of that same name, and AWS::EarlyValidation::ResourceExistenceCheck
  # fails the changeset before any resource event exists. A generated name
  # cannot collide with the one that came back. LoggingConfig sends the
  # function's logs here so Lambda does not create the default group either.
  HealthKbProvisionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      RetentionInDays: 30

  HealthKbProvisionFunction:
    Type: AWS::Serverless::Function
    Condition: HealthKnowledgeBaseEnabled
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/health_kb_provision.handler
      Role: !GetAtt HealthKbProvisionRole.Arn
      LoggingConfig:
        LogGroup: !Ref HealthKbProvisionLogGroup
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 900

  # Ref is the knowledge base id. GetAtt KnowledgeBaseArn and DataSourceId
  # are the attributes the function returns. The worker, the sync role, and
  # the stack outputs already read those names.
  HealthKnowledgeBase:
    Type: AWS::CloudFormation::CustomResource
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      ServiceToken: !GetAtt HealthKbProvisionFunction.Arn
      KnowledgeBaseName: !Sub "health-registry-${AWS::StackName}"
      Description: Index of ContextWeave's health bucket for the health_prep team.
      RoleArn: !GetAtt HealthKnowledgeBaseRole.Arn
      EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-multimodal-embeddings-v1:0"
      MultimodalBucket: !Ref HealthMultimodalBucket
      DocsBucketName: !Ref HealthDocsBucketName
      DocsBucketOwnerAccountId: !Ref AWS::AccountId

  HealthKbSyncRole:
    Type: AWS::IAM::Role
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      RoleName: !Sub "${AWS::StackName}-health-kb-sync-role"
      Description: Starts an ingestion job when the health bucket changes. It cannot read the records.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: health-kb-sync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt HealthKbSyncLogGroup.Arn
              - Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:ListIngestionJobs
                Resource: !GetAtt HealthKnowledgeBase.KnowledgeBaseArn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt HealthKbSyncQueue.Arn

  # Same generated name as the provision group. This function never ran on
  # the failed deploy, so its default group is the less likely leftover;
  # the first invoke would otherwise arm the same failure for the retry
  # after that.
  HealthKbSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      RetentionInDays: 30

  HealthKbSyncFunction:
    Type: AWS::Serverless::Function
    Condition: HealthKnowledgeBaseEnabled
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/health_kb.sync_handler
      Role: !GetAtt HealthKbSyncRole.Arn
      LoggingConfig:
        LogGroup: !Ref HealthKbSyncLogGroup
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 120
      # One running start. A second invocation would be another
      # StartIngestionJob while the first is still talking to Bedrock.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          HEALTH_KNOWLEDGE_BASE_ID: !Ref HealthKnowledgeBase
          HEALTH_DATA_SOURCE_ID: !GetAtt HealthKnowledgeBase.DataSourceId

  # No QueueName. A rolled-back queue leaves the name behind, and the next
  # changeset fails ResourceExistenceCheck on an Add of that same name.
  # Object events land here instead of on the function: one message per
  # object, one batch per minute, one ingestion job.
  #
  # ScalingConfig is absent from the mapping on purpose.
  # MaximumConcurrency cannot be 1 — the property's minimum is 2 — and 2
  # pollers would both call StartIngestionJob. ReservedConcurrentExecutions
  # on the function is what keeps a single start in flight. A poller that
  # loses that race is throttled; SQS holds the batch invisible until
  # VisibilityTimeout and then delivers it again. That timeout is six times
  # the function's 120s so the retry does not overlap a batch Lambda may
  # still be running. A deferred start (a job already STARTING or
  # IN_PROGRESS, or Bedrock still throttling after the in-process retries)
  # returns the same messages as batch item failures and waits out the same
  # timeout, so the follow-up sync still happens.
  #
  # After 1000 receives the message moves to the DLQ. 1000 times 720s is
  # longer than an ingestion, so a follow-up is not dead-lettered while a
  # job is still running. The DLQ has no consumer. If it holds messages,
  # redrive the source queue or start one ingestion job by hand.
  HealthKbSyncDlq:
    Type: AWS::SQS::Queue
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  HealthKbSyncQueue:
    Type: AWS::SQS::Queue
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      VisibilityTimeout: 720
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HealthKbSyncDlq.Arn
        maxReceiveCount: 1000

  # SourceAccount, not the rule ARN. The rule target is this queue, so a
  # policy that names the rule and a rule that depends on the policy is a
  # cycle, and EventBridge refuses the target until the policy exists.
  HealthKbSyncQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      Queues:
        - !Ref HealthKbSyncQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt HealthKbSyncQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  HealthKbSyncRule:
    Type: AWS::Events::Rule
    Condition: HealthKnowledgeBaseEnabled
    DependsOn: HealthKbSyncQueuePolicy
    Properties:
      Description: Re-index ContextWeave's health bucket when a record is uploaded or removed.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
          - Object Deleted
        detail:
          bucket:
            name:
              - !Ref HealthDocsBucketName
      State: ENABLED
      Targets:
        - Id: HealthKbSync
          Arn: !GetAtt HealthKbSyncQueue.Arn

  HealthKbSyncMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HealthKnowledgeBaseEnabled
    Properties:
      EventSourceArn: !GetAtt HealthKbSyncQueue.Arn
      FunctionName: !Ref HealthKbSyncFunction
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 60
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ── Portfolio knowledge base ───────────────────────────────────────────────
  # The documents are this stack's bucket. ContextWeave has a health bucket
  # and no portfolio equivalent, so this section creates the bucket, the
  # knowledge base, and the connector. Upload CSV, PDF, and brokerage
  # statements to PortfolioBucket. The deploy starts one ingestion job;
  # later uploads land on PortfolioKbSyncQueue and one invocation starts
  # one ingestion job. See HealthKbSyncQueue for why it is a queue.
  #
  # The embedding is the same Nova managed base as health: custom embedding,
  # amazon.nova-2-multimodal-embeddings-v1:0, dimensions 1024, FLOAT32.
  # HealthKbProvisionFunction's handler is shared. This function is a second
  # caller because the health one exists only when ContextWeave published a
  # health bucket, and a portfolio must still be created when that import is
  # empty.
  #
  # Supplemental storage is a bucket, not a prefix. HealthMultimodalBucket
  # exists only when the health import is present, so the portfolio base has
  # its own bucket for extracted media. That bucket is not a data source.
  # Writing extracted files back into PortfolioBucket would ingest them again
  # as if they were statements.

  PortfolioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-portfolios-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  PortfolioMultimodalBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-portfolio-mm-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  PortfolioKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role the portfolio knowledge base assumes to read uploaded statements and write extracted media.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: portfolio-kb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-multimodal-embeddings-v1:0"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt PortfolioBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${PortfolioBucket.Arn}/*"
              # Write access is only for extracted media. The statement
              # bucket stays read-only so ingestion cannot rewrite an upload.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt PortfolioMultimodalBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${PortfolioMultimodalBucket.Arn}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId

  # Not in the VPC. bedrock-agent is IPv4-only, and this function's whole
  # job is CreateKnowledgeBase. No FunctionName and no LogGroupName: a
  # rolled-back create leaves those names behind, and the next changeset
  # fails ResourceExistenceCheck before any resource event exists.
  PortfolioKbProvisionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-portfolio-kb-provision-role"
      Description: Creates the managed portfolio knowledge base. It cannot read the statements.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: portfolio-kb-provision
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PortfolioKbProvisionLogGroup.Arn
              - Effect: Allow
                Action:
                  - bedrock:CreateKnowledgeBase
                  - bedrock:ListKnowledgeBases
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:UpdateKnowledgeBase
                  - bedrock:DeleteKnowledgeBase
                  - bedrock:CreateDataSource
                  - bedrock:GetDataSource
                  - bedrock:UpdateDataSource
                  - bedrock:DeleteDataSource
                  - bedrock:ListDataSources
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt PortfolioKnowledgeBaseRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock.amazonaws.com

  PortfolioKbProvisionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  PortfolioKbProvisionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/health_kb_provision.handler
      Role: !GetAtt PortfolioKbProvisionRole.Arn
      LoggingConfig:
        LogGroup: !Ref PortfolioKbProvisionLogGroup
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 900

  # Ref is the knowledge base id. GetAtt KnowledgeBaseArn and DataSourceId
  # are the attributes the function returns.
  PortfolioKnowledgeBase:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PortfolioKbProvisionFunction.Arn
      KnowledgeBaseName: !Sub "portfolios-${AWS::StackName}"
      Description: Index of this stack's portfolio bucket for the financial_advisors team.
      RoleArn: !GetAtt PortfolioKnowledgeBaseRole.Arn
      EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-multimodal-embeddings-v1:0"
      MultimodalBucket: !Ref PortfolioMultimodalBucket
      DocsBucketName: !Ref PortfolioBucket
      DocsBucketOwnerAccountId: !Ref AWS::AccountId
      DataSourceName: portfolio-s3
      DataSourceDescription: This stack's portfolio bucket. Statements uploaded here are the source.

  PortfolioKbSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-portfolio-kb-sync-role"
      Description: Starts an ingestion job when the portfolio bucket changes. It cannot read the statements.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: portfolio-kb-sync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PortfolioKbSyncLogGroup.Arn
              - Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:ListIngestionJobs
                Resource: !GetAtt PortfolioKnowledgeBase.KnowledgeBaseArn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt PortfolioKbSyncQueue.Arn

  PortfolioKbSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  PortfolioKbSyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/portfolio_kb.sync_handler
      Role: !GetAtt PortfolioKbSyncRole.Arn
      LoggingConfig:
        LogGroup: !Ref PortfolioKbSyncLogGroup
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 120
      # One running start. Bulk uploads used to invoke this once per object
      # and Bedrock throttled StartIngestionJob.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          PORTFOLIO_KNOWLEDGE_BASE_ID: !Ref PortfolioKnowledgeBase
          PORTFOLIO_DATA_SOURCE_ID: !GetAtt PortfolioKnowledgeBase.DataSourceId

  # No QueueName. See HealthKbSyncQueue: a fixed name is what
  # ResourceExistenceCheck rejects after a rollback, and the visibility
  # timeout, the missing ScalingConfig, and the DLQ are the same choice.
  PortfolioKbSyncDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  PortfolioKbSyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PortfolioKbSyncDlq.Arn
        maxReceiveCount: 1000

  PortfolioKbSyncQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PortfolioKbSyncQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PortfolioKbSyncQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  PortfolioKbSyncRule:
    Type: AWS::Events::Rule
    DependsOn: PortfolioKbSyncQueuePolicy
    Properties:
      Description: Re-index the portfolio bucket when a statement is uploaded or removed.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
          - Object Deleted
        detail:
          bucket:
            name:
              - !Ref PortfolioBucket
      State: ENABLED
      Targets:
        - Id: PortfolioKbSync
          Arn: !GetAtt PortfolioKbSyncQueue.Arn

  PortfolioKbSyncMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt PortfolioKbSyncQueue.Arn
      FunctionName: !Ref PortfolioKbSyncFunction
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 60
      FunctionResponseTypes:
        - ReportBatchItemFailures


Outputs:
  HttpApiUrl:
    Value: !Sub "https://${TeamWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  StateMachineArn:
    Value: !Ref StateMachine
  TriggerFunctionArn:
    Value: !GetAtt TriggerFunction.Arn
  StatusFunctionArn:
    Value: !GetAtt StatusFunction.Arn
  WorkerFunctionArn:
    Value: !GetAtt WorkerFunction.Arn
  ProvisionTeamFunctionArn:
    Value: !GetAtt ProvisionTeamFunction.Arn
  GeminiResearchFunctionArn:
    Value: !GetAtt GeminiResearchFunction.Arn
  WorkerRoleArn:
    Value: !GetAtt WorkerRole.Arn
  DdbTable:
    Value: !If [CreateDdbTable, !Ref ContentPipelineRunsTable, !Ref DdbTableName]
  ConfigBucket:
    Value: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
  ArtifactBucket:
    Value: !If [CreateArtifactBucket, !Ref TeamArtifactBucket, !Ref ArtifactBucketName]
  ObservatoryMetricsTable:
    Value: !Ref ObservatoryMetricsTableName
    Description: Observatory DynamoDB table name (sourced from shared stack)
  AMPWorkspaceArn:
    Value: !Ref AMPWorkspaceArn
    Description: AMP workspace ARN (sourced from shared stack)
  AMPWorkspaceId:
    Value: !Ref AMPWorkspaceId
    Description: AMP workspace ID (sourced from shared stack)
  ObservatoryMetricsFunctionArn:
    Value: !GetAtt ObservatoryMetricsFunction.Arn
  VectorDbSecretArn:
    Value: !Ref VectorDbSecret
    Description: ARN of the Secrets Manager secret holding RDS credentials
  TeamWeaveWAFArn:
    Condition: DeployWAF
    Value: !GetAtt TeamWeaveWAF.Arn
  ApiGatewayAccessLogGroupArn:
    Value: !GetAtt ApiGatewayAccessLogGroup.Arn
    Description: CloudWatch Log Group ARN for API Gateway access logs
  SharedStackName:
    Value: !Ref SharedStackName
    Description: Name of the shared infrastructure stack supplying Observatory and shared networking resources
  LambdaSubnetIds:
    Value: !Ref LambdaSubnetIds
    Description: Lambda private subnet IDs (sourced from shared stack)
  S3VpcEndpointId:
    Value: !Ref S3VpcEndpointId
    Description: S3 Gateway VPC endpoint ID (sourced from shared stack)
  DynamoDbVpcEndpointId:
    Value: !Ref DynamoDbVpcEndpointId
    Description: DynamoDB Gateway VPC endpoint ID (sourced from shared stack)
  NatInstanceId:
    Value: !Ref NatInstanceId
    Description: NAT instance ID for Bedrock IPv4 egress from Lambda subnets (sourced from shared stack)
  DualStackEnabled:
    Value: !Ref DualStackEnabled
    Description: Whether Lambda subnets are dual-stack (IPv4 + IPv6) — sourced from shared stack

  # The outputs below complete the set an automation harness needs to resolve
  # every coordinate from `describe-stacks` alone. scripts/stack_env.py reads
  # them; tests/test_openapi_contract.py asserts each one still exists and, for
  # the index names, that the shared stack actually defines an index by that
  # name. An output naming an index that does not exist is worse than no
  # output: the query fails at runtime rather than at deploy.

  ObservatoryMetricsSpanTimelineIndex:
    Value: SpanTimelineIndex
    Description: >
      GSI on the Observatory metrics table, partitioned by span_date (a UTC
      YYYY-MM-DD bucket) and sorted by timestamp. This is how the timeline is
      read; ObservatoryMetricsTable on its own does not tell a caller that, and
      a caller who guesses wrong scans the whole table. Defined in
      infra/shared.yaml.

  ObservatoryMetricsAgentIdTimestampIndex:
    Value: AgentIdTimestampIndex
    Description: GSI for per-agent queries (agent_id → timestamp). Defined in infra/shared.yaml.

  ContextWeaveUrl:
    Value: !Ref ContextWeaveUrl
    Description: >
      Base URL of the ContextWeave knowledge layer, or empty when not
      configured. GET /observability returns null (not an error) for its
      routingGraph and routingDecisions sections in that case, so a harness
      reads this to tell "not configured" from "configured and broken".

  HealthKnowledgeBaseId:
    Condition: HealthKnowledgeBaseEnabled
    Description: >
      Bedrock knowledge base over ContextWeave's health bucket, embedded with
      amazon.nova-2-multimodal-embeddings-v1:0. Absent when that bucket was not
      published, which is how a harness tells "health is off" from "the base
      failed".
    Value: !Ref HealthKnowledgeBase
  HealthDataSourceId:
    Condition: HealthKnowledgeBaseEnabled
    Description: Managed S3 connector of the health knowledge base. The bucket is ContextWeave's.
    Value: !GetAtt HealthKnowledgeBase.DataSourceId

  PortfolioBucketName:
    Description: >-
      S3 bucket for portfolio uploads (CSV, PDF, brokerage statements).
      Encrypted, versioned, public access blocked. Objects are indexed into
      PortfolioKnowledgeBaseId. The stack name is part of the bucket name, so
      it must stay lowercase and the full name must stay within 63 characters.
    Value: !Ref PortfolioBucket
  PortfolioKnowledgeBaseId:
    Description: >-
      Bedrock knowledge base over PortfolioBucketName, embedded with
      amazon.nova-2-multimodal-embeddings-v1:0 at 1024 dimensions, FLOAT32.
    Value: !Ref PortfolioKnowledgeBase
  PortfolioDataSourceId:
    Description: Managed S3 connector of the portfolio knowledge base. The data source name is portfolio-s3.
    Value: !GetAtt PortfolioKnowledgeBase.DataSourceId

  OpenApiSpecPath:
    Value: openapi/teamweave.yaml
    Description: >
      Repo-relative path to the OpenAPI description of this API. Its `servers`
      block is templated on HttpApiUrl above, so a harness resolves the stack
      first and the spec second rather than hardcoding a URL.

  AgentCoreRuntimeArn:
    Condition: AgentCoreEnabled
    Description: >
      The stack-wide fallback runtime, used only by a team that has none of
      its own. Per-team runtimes are in AgentCoreTeamRuntimeArns.
    Value: !GetAtt AgentCoreRuntime.AgentRuntimeArn
  AgentCoreTeamRuntimeArns:
    Condition: AgentCoreEnabled
    Description: >
      team name -> the AgentCore runtime that serves it, as JSON. The same
      value the worker reads from AGENTCORE_TEAM_RUNTIME_ARNS. Published so
      the deploy can invoke each one for real: CloudFormation creating a
      runtime says nothing about whether the program inside it boots, and a
      runtime that does not boot surfaces as an opaque "Worker task failed"
      minutes later in whichever pipeline happened to use it.
    Value: !Sub
      - '{"tarun_visibility_team":"${ArnTarunVisibilityTeam}"}'
      - ArnTarunVisibilityTeam: !GetAtt AgentCoreRuntimeTarunVisibilityTeam.AgentRuntimeArn
  AgentCardUrl:
    Description: The A2A Agent Card every client fetches first.
    Value: !Sub "https://${TeamWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/prod/.well-known/agent-card.json"
  AgentCoreRuntimeId:
    Condition: AgentCoreEnabled
    # CreateAgentRuntimeEndpoint takes agentRuntimeId, not the ARN. Publishing
    # it keeps the registry step from parsing an ARN to recover a field the
    # stack already knows.
    Description: Runtime id the agent endpoints are created against.
    Value: !GetAtt AgentCoreRuntime.AgentRuntimeId
  AgentCoreRuntimeVersion:
    Condition: AgentCoreEnabled
    # Every endpoint pins a version. Without this an endpoint created today
    # keeps serving today's artifact after the next deploy, and the registry
    # would drift from the runtime silently.
    Description: Runtime version the agent endpoints are pinned to.
    Value: !GetAtt AgentCoreRuntime.AgentRuntimeVersion
  AgentCoreMemoryId:
    Condition: AgentCoreEnabled
    Description: Session memory for agents on AgentCore.
    Value: !GetAtt AgentCoreMemory.MemoryId
  AgentCoreRuntimeRoleArn:
    Condition: AgentCoreEnabled
    Description: Execution role assumed by agents on AgentCore.
    Value: !GetAtt AgentCoreRuntimeRole.Arn

  AgentCoreGatewayId:
    Condition: AgentCoreEnabled
    Description: Gateway through which agents reach external MCP tools.
    Value: !GetAtt AgentCoreGateway.GatewayIdentifier
  AgentCoreGatewayUrl:
    Condition: AgentCoreEnabled
    Description: MCP endpoint agents call instead of each tool directly.
    Value: !GetAtt AgentCoreGateway.GatewayUrl
