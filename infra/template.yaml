    DependsOn: TriggerFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/trigger_handler.handler
      Role: !GetAtt TriggerRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Events:
        TeamTaskEvent:
          Type: Api
