AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bedrock multi-agent teams + personal improvement tasks (config-driven)

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # W3660: CorsGatewayResponseDefault4XX and CorsGatewayResponseDefault5XX are
        # intentionally separate AWS::ApiGateway::GatewayResponse resources. They add
        # CORS headers to gateway-level error responses (auth failures, WAF blocks,
        # throttling) that the inline Cors setting on TeamWeaveApi does not cover.
        # These resources are complementary to the API Body, not conflicting with it.
        - W3660

Parameters:
  ConfigBucketName:
    Type: String
    Default: ""
    Description: S3 bucket that holds team configs (teams/{TEAM}/{VERSION}/team.json)
  ArtifactBucketName:
    Type: String
    Default: ""
    Description: S3 bucket for run artifacts (runs/{summary}-{suffix}/{step_id}.json)
  TeamConfigPrefix:
    Type: String
    Default: teams
    Description: "Prefix in config bucket for team configs (default: teams)"
  VectorDbTable:
    Type: String
    Default: "rag_chunks"
    Description: Vector store collection/table identifier (used for explicit RAG mode)
  VectorDbHost:
    Type: String
    Default: "resume-rag-db.cplgkqp9qd3a.us-east-1.rds.amazonaws.com"
    Description: PostgreSQL host for explicit RAG mode (pgvector)
  VectorDbPort:
    Type: String
    Default: "5432"
    Description: PostgreSQL port for explicit RAG mode
  VectorDbName:
    Type: String
    Default: "postgres"
    Description: PostgreSQL database name for explicit RAG mode
  VectorDbUser:
    Type: String
    Default: "masteruser"
    Description: PostgreSQL username for explicit RAG mode
  VectorDbPassword:
    Type: String
    NoEcho: true
    Default: "YourStrongPassword123!"
    Description: PostgreSQL password for explicit RAG mode
  VectorDbUrl:
    Type: String
    NoEcho: true
    Default: "postgresql://masteruser:YourStrongPassword123!@resume-rag-db.cplgkqp9qd3a.us-east-1.rds.amazonaws.com:5432/postgres"
    Description: Full PostgreSQL connection URL. When set, this overrides host/port/name/user/password parameters.
  ContextWeaveUrl:
    Type: String
    Default: ""
    Description: >-
      Base URL of the ContextWeave knowledge layer API (used by RAG mode "contextweave",
      e.g. https://abc123.execute-api.us-east-1.amazonaws.com/prod). Empty means the mode is
      unavailable and any team selecting it fails at config-load time.
  HealthDocsBucketName:
    Type: String
    Default: ""
    Description: >-
      Name of ContextWeave's health document bucket, taken from that stack's
      HealthDocsBucketName output during deploy. Empty means the health surface
      is off and this stack creates no knowledge base. This stack does not
      create the bucket; the documents stay where ContextWeave put them.
  HealthDocsKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the KMS key that encrypts that bucket, taken from ContextWeave's
      KMSKeyArn output. The knowledge base role decrypts with it. Empty leaves
      the knowledge base uncreated, because a base that cannot read the objects
      would deploy green and fail at the first ingestion.
  ContextWeaveFeedbackOnValidOutput:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: >-
      Set to "1" to up-vote the ContextWeave answer that grounded a run whose structured output
      validated (POST /feedback). Off by default.
  GeminiSecretArn:
    Type: String
    Default: ""
    Description: >-
      Secrets Manager ARN storing the Gemini API key, as {"key":"..."} or the
      raw key. The research brief and financial_advisors web search both read
      it. Empty means live web citations are not configured.
  WebSearchSecretArn:
    Type: String
    Default: ""
    Description: >-
      Optional Secrets Manager ARN that overrides GeminiSecretArn for
      financial_advisors web search only. Same JSON shape. Empty keeps the
      Gemini secret.
  DdbTableName:
    Type: String
    Default: ""
    Description: Optional. Leave blank to create a new DynamoDB table.
  VpcId:
    Type: String
    Default: "vpc-f3c92a8a"
    Description: VPC ID for Lambda networking to RDS.
  LambdaSubnetIds:
    Type: String
    Default: ""
    Description: >
      Comma-separated private subnet IDs for Lambda ENIs — taken from shared stack
      LambdaSubnetIds output. Subnets are created and owned by shared.yaml.
  RdsSecurityGroupId:
    Type: String
    Default: "sg-06e6751625773c1bf"
    Description: RDS security group ID (resume-rag-sg) to allow PostgreSQL traffic from Lambda.
  SamDeployerRoleName:
    Type: String
    Default: ""
    Description: Optional IAM role name used by CI/CD for SAM deployment. When set, stack creation grants Step Functions deployment permissions to this role.
  SamAssumeRoleName:
    Type: String
    Default: ""
    Description: Optional IAM role name assumed during `sam deploy` that needs S3 team config upload permissions.
  BedrockAgentServiceRoleArn:
    Type: String
    Default: "arn:aws:iam::239571291755:role/BedrockAgentServiceRole-Tarun"
    Description: IAM role ARN passed to Bedrock CreateAgent as AgentResourceRoleArn.
  AllowedCorsOrigin:
    Type: String
    Default: "'*'"
    Description: "Allowed CORS origin for the API Gateway (e.g. 'https://app.example.com'). Use '*' to allow all origins including Lambda invocations."
  EnableWAF:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to 'true' to deploy a WAF WebACL with AWS managed rule sets and attach it to the API Gateway stage.
  SharedStackName:
    Type: String
    Default: "tarun-teamweave-shared"
    Description: >
      Name of the shared infrastructure CloudFormation stack (shared.yaml). Its outputs
      supply the Observatory DynamoDB table, AMP workspace, and shared networking outputs used here.
  ObservatoryMetricsTableName:
    Type: String
    Description: Observatory DynamoDB table name — taken from shared stack ObservatoryMetricsTableName output.
  ObservatoryMetricsTableArn:
    Type: String
    Description: Observatory DynamoDB table ARN — taken from shared stack ObservatoryMetricsTableArn output.
  AMPWorkspaceArn:
    Type: String
    Description: AMP workspace ARN — taken from shared stack AMPWorkspaceArn output.
  AMPWorkspaceId:
    Type: String
    Description: AMP workspace ID — taken from shared stack AMPWorkspaceId output.
  S3VpcEndpointId:
    Type: String
    Default: ""
    Description: S3 Gateway VPC endpoint ID — taken from shared stack S3VpcEndpointId output (optional).
  DynamoDbVpcEndpointId:
    Type: String
    Default: ""
    Description: DynamoDB Gateway VPC endpoint ID — taken from shared stack DynamoDbVpcEndpointId output (optional).
  NatInstanceId:
    Type: String
    Default: ""
    Description: NAT instance ID used by Lambda subnets for Bedrock IPv4 egress — taken from shared stack NatInstanceId output (optional).
  DualStackEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Whether Lambda subnets are configured for dual-stack (IPv4 + IPv6) — taken from
      shared stack DualStackEnabled output. When 'true', Lambda ENIs receive IPv6 addresses
      and outbound IPv6 traffic is permitted via the Egress-Only Internet Gateway.
  SiweAuthorizerFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the SIWE Lambda authorizer function exported from the siwe-infra CloudFormation stack (AuthorizerFunctionArn output).
  DPOTrainingBucketName:
    Type: String
    Default: ""
    Description: >
      S3 bucket name for DPO training data — taken from shared stack DPOTrainingBucketName output.
      When set, WorkerFunction invokes each agent twice per step and uploads chosen/rejected
      pairs when composite_risk_score delta exceeds DPODeltaThreshold.
  DPODeltaThreshold:
    Type: String
    Default: "0.4"
    Description: Minimum composite_risk_score delta between two invocations to trigger DPO pair upload.

  EnableAgentCore:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Provision the AgentCore substrate (Memory, execution role, and the
      runtime that hosts src/agentcore/app.py). Off by default: these are
      billable resources, and the runtime needs its code artifact uploaded to
      the config bucket first. Turning it on is the whole of phases 2 and 5.
  AgentCoreRuntimeCodePrefix:
    Type: String
    Default: "agentcore/app.zip"
    Description: Key of the agent code artifact within the config bucket.
  AgentCoreDefaultModelId:
    Type: String
    Default: "deepseek.v3.2"
    Description: >
      Last-resort model inside the AgentCore program when a turn arrives
      without modelId. The model map's default category is the same id.
      A turn from the worker always carries the id resolve_model chose.
  ImageModelId:
    Type: String
    Default: ""
    Description: >
      Optional Bedrock image-model override. Empty means the model map's
      image_generation category chooses the illustrator. A non-empty value
      is an IMAGE_MODEL_ID override for bedrock_image when a caller passes
      no declared id. Nova Canvas and Titan Image are the families
      bedrock_image knows how to build a body for.

  GeminiImageModel:
    Type: String
    Default: ""
    Description: >
      Optional override of the model map's image_generation category.
      Empty leaves the map in charge. Only the `:generateContent` family
      is supported. The key comes from GEMINI_SECRET_ARN.

  AgentCoreGatewayName:
    Type: String
    Default: "teamweave-tools"
    AllowedPattern: "^([0-9a-zA-Z][-]?){1,48}$"
    Description: >
      Gateway name. Unlike Memory, this pattern does allow hyphens -- the two
      services differ, which is why each default is checked against its own
      published pattern rather than assumed.
  ScreenWeaveMcpEndpoint:
    Type: String
    Default: ""
    Description: >
      ScreenWeave's MCP endpoint (https://.../mcp), published by that stack.
      Empty means no gateway target is created: a gateway with nothing behind
      it is infrastructure for nothing.
  CipherWeaveMcpEndpoint:
    Type: String
    Default: ""
    Description: >
      CipherWeave's MCP endpoint (https://.../mcp), published by that stack as
      CipherWeaveApiEndpoint. Empty means no target is created for it.
  DataDictionaryMcpEndpoint:
    Type: String
    Default: ""
    Description: >
      DataDictionary's MCP endpoint (https://.../mcp), published by that stack
      as DataDictionaryFunctionUrl. Empty means no target is created for it.
  ToolWeaveMcpEndpoint:
    Type: String
    Default: ""
    Description: >
      ToolWeave's MCP endpoint (https://.../mcp), published by that stack as
      ToolWeaveApiEndpoint. Empty means no target is created for it.
  A2AAgentVersion:
    Type: String
    Default: "1.0.0"
    Description: Version reported in the A2A Agent Card.
  A2AProvider:
    Type: String
    Default: "TeamWeave"
    Description: Provider organization reported in the A2A Agent Card.
  A2ADocumentationUrl:
    Type: String
    Default: ""
    Description: Optional documentationUrl for the A2A Agent Card.
  AgentCoreRuntimeName:
    Type: String
    Default: "teamweave_agent"
    # CreateAgentRuntime's agentRuntimeName must match
    # [a-zA-Z][a-zA-Z0-9_]{0,47} -- letters, digits and underscores only. It
    # was built from ${AWS::StackName}, and this stack is tarun-content-team,
    # so the name could never have been created: every deploy that reached
    # this resource failed on it and rolled the whole update back. Same
    # constraint, same mistake and same fix as AgentCoreMemoryName below; the
    # difference is that this one is now checked by a test that walks every
    # AgentCore name property rather than one written per property.
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,47}"
    Description: Name of the AgentCore runtime. Letters, digits and underscores only.
  AgentCoreMemoryName:
    Type: String
    Default: "teamweave_session_memory"
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,47}$"
    Description: >
      Memory resource name. The service pattern allows only letters, digits
      and underscores and must start with a letter -- notably no hyphens, so
      it cannot be derived from a stack name like tarun-content-team.
  AgentCoreMemoryExpiryDays:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 365
    Description: How long AgentCore keeps conversational events.

Conditions:
  CreateConfigBucket: !Equals [!Ref ConfigBucketName, ""]
  CreateArtifactBucket: !Equals [!Ref ArtifactBucketName, ""]
  CreateDdbTable: !Equals [!Ref DdbTableName, ""]
  HasGeminiSecret: !Not [!Equals [!Ref GeminiSecretArn, ""]]
  HasWebSearchSecret: !Not [!Equals [!Ref WebSearchSecretArn, ""]]
  HasVpcConfig: !And
    - !Not [!Equals [!Ref VpcId, ""]]
    - !Not [!Equals [!Ref RdsSecurityGroupId, ""]]
    - !Not [!Equals [!Ref LambdaSubnetIds, ""]]
  HasSamDeployerRoleName: !Not [!Equals [!Ref SamDeployerRoleName, ""]]
  HasSamAssumeRoleName: !Not [!Equals [!Ref SamAssumeRoleName, ""]]
  DeployWAF: !Equals [!Ref EnableWAF, "true"]
  AgentCoreEnabled: !Equals [!Ref EnableAgentCore, "true"]
  # One condition per target, never one shared switch. A single
  # AgentCoreGatewayTargetEnabled gated every target on ScreenWeave's
  # parameter, so a sibling that *was* configured would still get no target
  # whenever ScreenWeave was not -- the crossed-wiring failure this template
  # has already had once, with two teams' runtime substitutions.
  ScreenWeaveTargetEnabled: !And
    - !Condition AgentCoreEnabled
    - !Not [!Equals [!Ref ScreenWeaveMcpEndpoint, ""]]
  CipherWeaveTargetEnabled: !And
    - !Condition AgentCoreEnabled
    - !Not [!Equals [!Ref CipherWeaveMcpEndpoint, ""]]
  DataDictionaryTargetEnabled: !And
    - !Condition AgentCoreEnabled
    - !Not [!Equals [!Ref DataDictionaryMcpEndpoint, ""]]
  ToolWeaveTargetEnabled: !And
    - !Condition AgentCoreEnabled
    - !Not [!Equals [!Ref ToolWeaveMcpEndpoint, ""]]
  HasSiweAuthorizer: !Not [!Equals [!Ref SiweAuthorizerFunctionArn, ""]]
  HasDPOBucket: !Not [!Equals [!Ref DPOTrainingBucketName, ""]]
  # Both come from ContextWeave. The bucket name without the key would index
  # objects this role cannot decrypt; the key without the bucket has nothing
  # to read. Either one missing leaves the base uncreated.
  HealthKnowledgeBaseEnabled: !And
    - !Not [!Equals [!Ref HealthDocsBucketName, ""]]
    - !Not [!Equals [!Ref HealthDocsKmsKeyArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        LOG_LEVEL: DEBUG
        # Which substrate runs an agent turn, and where. Without the ARN the
        # agentcore runtime rejects every call before attempting it, so these
        # two travel together.
        AGENT_RUNTIME: !If [AgentCoreEnabled, "agentcore", "classic"]
        AGENTCORE_RUNTIME_ARN: !If [AgentCoreEnabled, !GetAtt AgentCoreRuntime.AgentRuntimeArn, ""]
        # Empty uses the model map's schema_repair category. A non-empty
        # value is a logged override of that category.
        STRUCTURED_TRANSFORM_MODEL_ID: ""
        IMAGE_MODEL_ID: !Ref ImageModelId
        GEMINI_IMAGE_MODEL: !Ref GeminiImageModel
        # team name -> its runtime ARN. One variable rather than one per team:
        # Lambda's environment is a flat map the template names statically, so
        # a per-team variable would need wiring through every function. The
        # worker falls back to AGENTCORE_RUNTIME_ARN above for a team absent
        # here, which is a worse answer than the right runtime and a far
        # better one than failing every turn.
        AGENTCORE_TEAM_RUNTIME_ARNS: !If
          - AgentCoreEnabled
          - !Sub
            - '{"tarun_visibility_team":"${ArnTarunVisibilityTeam}","daily_operator":"${ArnDailyOperator}","linkedin_quick_post":"${ArnLinkedinQuickPost}","job_hunter":"${ArnJobHunter}","health_prep":"${ArnHealthPrep}","financial_advisors":"${ArnFinancialAdvisors}"}'
            - ArnTarunVisibilityTeam: !GetAtt AgentCoreRuntimeTarunVisibilityTeam.AgentRuntimeArn
              ArnDailyOperator: !GetAtt AgentCoreRuntimeDailyOperator.AgentRuntimeArn
              ArnLinkedinQuickPost: !GetAtt AgentCoreRuntimeLinkedinQuickPost.AgentRuntimeArn
              ArnJobHunter: !GetAtt AgentCoreRuntimeJobHunter.AgentRuntimeArn
              ArnHealthPrep: !GetAtt AgentCoreRuntimeHealthPrep.AgentRuntimeArn
              ArnFinancialAdvisors: !GetAtt AgentCoreRuntimeFinancialAdvisors.AgentRuntimeArn
          - "{}"
        # Route all AWS SDK calls through dual-stack endpoints so boto3 resolves
        # {service}.{region}.api.aws (returns AAAA records). Lambda ENIs with IPv6
        # addresses send this traffic via the Egress-Only Internet Gateway.
        # Weave sibling MCP endpoints, read by src/orchestrator/mcp_client.py.
        # The same parameters the gateway targets are gated on: one resolved
        # URL per sibling, not a second copy that can drift. Empty when that
        # sibling did not resolve, which the tool reports as an error in the
        # step's inputs rather than as a silent absence.
        SCREENWEAVE_MCP_URL: !Ref ScreenWeaveMcpEndpoint
        CIPHERWEAVE_MCP_URL: !Ref CipherWeaveMcpEndpoint
        DATADICTIONARY_MCP_URL: !Ref DataDictionaryMcpEndpoint
        TOOLWEAVE_MCP_URL: !Ref ToolWeaveMcpEndpoint
        AWS_USE_DUALSTACK_ENDPOINT: "true"
        # Explicit dual-stack endpoint for Step Functions so boto3 resolves
        # AAAA records and connects via the Egress-Only Internet Gateway.
        STEPFUNCTIONS_ENDPOINT_URL: !Sub "https://states.${AWS::Region}.api.aws"
        # ── IPv4 pins: services with no dual-stack endpoint ──────────────────
        #
        # AWS_USE_DUALSTACK_ENDPOINT above is a blanket instruction, so every
        # client builds {service}.{region}.api.aws unless pinned here. For a
        # service AWS does not publish a dual-stack endpoint for, that hostname
        # does not exist and the call dies in DNS resolution -- not at deploy,
        # not in CI (no dual-stack there), only inside the VPC at run time.
        #
        # These env vars are read by botocore and take precedence over
        # AWS_USE_DUALSTACK_ENDPOINT. The variable name is derived from the
        # service's own serviceId, not its client name, which is why Secrets
        # Manager is SECRETS_MANAGER and not SECRETSMANAGER.
        #
        # scripts/check_dualstack_pins.py re-tests every pin against DNS and
        # reports the ones that can be removed, so this list shrinks as AWS
        # ships dual-stack rather than ossifying.
        AWS_ENDPOINT_URL_BEDROCK: !Sub "https://bedrock.${AWS::Region}.amazonaws.com"
        AWS_ENDPOINT_URL_BEDROCK_RUNTIME: !Sub "https://bedrock-runtime.${AWS::Region}.amazonaws.com"
        AWS_ENDPOINT_URL_BEDROCK_AGENT: !Sub "https://bedrock-agent.${AWS::Region}.amazonaws.com"
        AWS_ENDPOINT_URL_BEDROCK_AGENT_RUNTIME: !Sub "https://bedrock-agent-runtime.${AWS::Region}.amazonaws.com"
        # AgentCore is the substrate every agent turn runs on and it was never
        # pinned: bedrock-agentcore.{region}.api.aws does not resolve, so every
        # invoke from inside the VPC failed in DNS. CI never saw it because the
        # runner has no AWS_USE_DUALSTACK_ENDPOINT set.
        AWS_ENDPOINT_URL_BEDROCK_AGENTCORE: !Sub "https://bedrock-agentcore.${AWS::Region}.amazonaws.com"
        AWS_ENDPOINT_URL_BEDROCK_AGENTCORE_CONTROL: !Sub "https://bedrock-agentcore-control.${AWS::Region}.amazonaws.com"
        # Secrets Manager has no dual-stack endpoint either. rag.py swallows the
        # failure and degrades to no RAG context; gemini.py raises. One is
        # invisible, which is worse.
        AWS_ENDPOINT_URL_SECRETS_MANAGER: !Sub "https://secretsmanager.${AWS::Region}.amazonaws.com"
        # S3 and DynamoDB *do* have dual-stack endpoints, and are pinned to IPv4
        # anyway -- deliberately. Their Gateway VPC endpoints are free and keep
        # this traffic off the internet entirely; the dual-stack hostnames would
        # route it out through the Egress-Only Internet Gateway instead, which
        # is strictly worse on both cost and exposure. IPv6 is the goal where it
        # replaces NAT, not where it replaces a private path.
        AWS_ENDPOINT_URL_S3: !Sub "https://s3.${AWS::Region}.amazonaws.com"
        AWS_ENDPOINT_URL_DYNAMODB: !Sub "https://dynamodb.${AWS::Region}.amazonaws.com"

Resources:
  VectorDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/vector-db-credentials"
      Description: PostgreSQL credentials for the TeamWeave RDS instance
      SecretString: !Sub |
        {
          "host": "${VectorDbHost}",
          "port": "${VectorDbPort}",
          "dbname": "${VectorDbName}",
          "username": "${VectorDbUser}",
          "password": "${VectorDbPassword}",
          "url": "${VectorDbUrl}"
        }

  TeamConfigBucket:
    Type: AWS::S3::Bucket
    Condition: CreateConfigBucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  TeamArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: CreateArtifactBucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionAndExpireArtifacts
            Status: Enabled
            Prefix: runs/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
            ExpirationInDays: 365

  ContentPipelineRunsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateDdbTable
    Properties:
      TableName: !Sub "${AWS::StackName}-CONTENT_PIPELINE_RUNS"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-worker-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:AssignIpv6Addresses
                  - ec2:UnassignIpv6Addresses
                Resource: "*"
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !If
                    - CreateConfigBucket
                    - !GetAtt TeamConfigBucket.Arn
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
                  - !If
                    - CreateConfigBucket
                    - !Ref "AWS::NoValue"
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}-*"
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !If
                    - CreateConfigBucket
                    - !Sub "${TeamConfigBucket.Arn}/*"
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
                  - !If
                    - CreateConfigBucket
                    - !Ref "AWS::NoValue"
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}-*/*"
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !If
                  - CreateArtifactBucket
                  - !Sub "${TeamArtifactBucket.Arn}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*"
              - !If
                - HasDPOBucket
                - Effect: Allow
                  Action: [s3:PutObject]
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${DPOTrainingBucketName}/*"
                - !Ref "AWS::NoValue"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !If [CreateDdbTable, !GetAtt ContentPipelineRunsTable.Arn, !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DdbTableName}"]
                  - !If [CreateDdbTable, !Sub "${ContentPipelineRunsTable.Arn}/index/*", !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DdbTableName}/index/*"]
                  - !Ref ObservatoryMetricsTableArn
                  - !Sub "${ObservatoryMetricsTableArn}/index/*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ProvisionTeamFunction.Arn
              # Classic. AGENT_RUNTIME=classic still runs agents deployed
              # before the switch, so the permission stays.
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - bedrock-agent-runtime:InvokeAgent
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*"
              # AgentCore -- the default substrate, and a different service
              # with a different action. Only the Classic permission was
              # granted, so with AGENT_RUNTIME=agentcore every agent turn was
              # refused: AccessDeniedException, from a function that had been
              # reaching the right endpoint all along. The deploy's own smoke
              # test never caught it because CI invokes the runtime as the
              # deployer role, which may do anything.
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:custom-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:imported-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:provisioned-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ProvisionTeamFunction.Arn
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-bedrock-agent-service-role"
              - !If
                - HasGeminiSecret
                - Effect: Allow
                  Action: [secretsmanager:GetSecretValue]
                  Resource: !Ref GeminiSecretArn
                - !Ref "AWS::NoValue"
              - !If
                - HasWebSearchSecret
                - Effect: Allow
                  Action: [secretsmanager:GetSecretValue]
                  Resource: !Ref WebSearchSecretArn
                - !Ref "AWS::NoValue"
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref VectorDbSecret
              - Effect: Allow
                Action:
                  - aps:RemoteWrite
                Resource: !Ref AMPWorkspaceArn
              # Retrieve on the health knowledge base only, and only when that
              # base exists. The action is scoped to its ARN so a worker that
              # can call Bedrock cannot read some other base. The team allowlist
              # and the caller token still decide whether a run may ask.
              - !If
                - HealthKnowledgeBaseEnabled
                - Effect: Allow
                  Action:
                    - bedrock:Retrieve
                  Resource: !GetAtt HealthKnowledgeBase.KnowledgeBaseArn
                - !Ref "AWS::NoValue"
              # The portfolio base always exists: the bucket is this stack's.
              # Scoped to its ARN so Retrieve cannot read some other base.
              # The team allowlist still decides whether a run may ask.
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !GetAtt PortfolioKnowledgeBase.KnowledgeBaseArn

  TriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-trigger-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trigger-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:AssignIpv6Addresses
                  - ec2:UnassignIpv6Addresses
                Resource: "*"
              - Effect: Allow
                Action:
                  # `states` is the IAM prefix; `sfn` is botocore's client
                  # name and grants nothing. StartExecution *is* scoped to the
                  # state machine -- unlike DescribeExecution, which is scoped
                  # to the execution. The two are genuinely different.
                  - states:StartExecution
                Resource: !Ref StateMachine
              - !If
                - HasVpcConfig
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                    - ec2:AssignPrivateIpAddresses
                    - ec2:UnassignPrivateIpAddresses
                    - ec2:AssignIpv6Addresses
                    - ec2:UnassignIpv6Addresses
                  Resource: "*"
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !If
                    - CreateConfigBucket
                    - !GetAtt TeamConfigBucket.Arn
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
                  - !If
                    - CreateConfigBucket
                    - !Ref "AWS::NoValue"
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}-*"
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !If
                    - CreateConfigBucket
                    - !Sub "${TeamConfigBucket.Arn}/*"
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
                  - !If
                    - CreateConfigBucket
                    - !Ref "AWS::NoValue"
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}-*/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !If [CreateDdbTable, !GetAtt ContentPipelineRunsTable.Arn, !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DdbTableName}"]
                  - !If [CreateDdbTable, !Sub "${ContentPipelineRunsTable.Arn}/index/*", !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DdbTableName}/index/*"]
                  - !Ref ObservatoryMetricsTableArn
                  - !Sub "${ObservatoryMetricsTableArn}/index/*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ProvisionTeamFunction.Arn
              - Effect: Allow
                Action:
                  - aps:QueryMetrics
                  - aps:GetLabels
                  - aps:GetSeries
                  - aps:GetMetricMetadata
                Resource: !Ref AMPWorkspaceArn
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref VectorDbSecret

  StatusRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-status-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: status-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:AssignIpv6Addresses
                  - ec2:UnassignIpv6Addresses
                Resource: "*"
              # DescribeExecution is authorized against the *execution* ARN,
              # not the state machine's. `!Sub "${StateMachine}:*"` expands to
              #
              #   arn:...:states:...:stateMachine:<name>:*
              #
              # and the thing being described is
              #
              #   arn:...:states:...:execution:<name>:<id>
              #
              # Different resource-type segment, so the statement matched
              # nothing and every poll of a run was denied -- which meant
              # GET /team/task/{run_id} could never report a result, however
              # well the pipeline ran. The A2A role got this right; this one
              # predated it.
              #
              # Only `states:` is a real IAM prefix. `sfn` is botocore's
              # client name (the same confusion as AWS_ENDPOINT_URL_SFN), so
              # `sfn:DescribeExecution` granted nothing and is gone.
              - Effect: Allow
                Action:
                  - states:DescribeExecution
                Resource:
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-state-machine:*"

  ConversationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-conversation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: conversation-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:AssignIpv6Addresses
                  - ec2:UnassignIpv6Addresses
                Resource: "*"
              # Classic. AGENT_RUNTIME=classic still runs agents deployed
              # before the switch, so the permission stays.
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - bedrock-agent-runtime:InvokeAgent
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*"
              # AgentCore -- the default substrate, and a different service
              # with a different action. Only the Classic permission was
              # granted, so with AGENT_RUNTIME=agentcore every agent turn was
              # refused: AccessDeniedException, from a function that had been
              # reaching the right endpoint all along. The deploy's own smoke
              # test never caught it because CI invokes the runtime as the
              # deployer role, which may do anything.
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*"

  A2ARole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-a2a-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: a2a-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              # A2AFunction declares VpcConfig like every other function here,
              # and Lambda attaches the ENI using *this* role -- before any
              # code runs. Without these the function cannot be created at
              # all: CREATE_FAILED with "does not have permissions to call
              # CreateNetworkInterface", which rolls the whole stack back.
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:AssignIpv6Addresses
                  - ec2:UnassignIpv6Addresses
                Resource: "*"
              # The card is generated from the live team configs, so a skill
              # cannot advertise an agent that no longer exists.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !If
                    - CreateConfigBucket
                    - !GetAtt TeamConfigBucket.Arn
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
                  - !If
                    - CreateConfigBucket
                    - !Sub "${TeamConfigBucket.Arn}/*"
                    - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
              # message:send starts the same execution POST /team/task starts;
              # tasks/{id} reads the same one the status handler reads.
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-state-machine"
              - Effect: Allow
                Action:
                  - states:DescribeExecution
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-state-machine:*"

