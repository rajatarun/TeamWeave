      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue

  AgentMetricsDashboardFunction:
    Type: AWS::Serverless::Function
    DependsOn: AgentMetricsDashboardFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/agent_metrics_handler.handler
