          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /departments/{dept_id}
            Method: get
            RequestParameters:
              - method.request.path.dept_id:
                  Required: true
                  Caching: false
        DepartmentByIdPutEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /departments/{dept_id}
            Method: put
            RequestParameters:
              - method.request.path.dept_id:
                  Required: true
                  Caching: false
        SchemasGetEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /schemas
            Method: get
        SchemaByRefGetEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /schemas/{schema_ref}
            Method: get
            RequestParameters:
              - method.request.path.schema_ref:
                  Required: true
                  Caching: false
      Environment:
        Variables:
          CONFIG_BUCKET: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
          CONFIG_PREFIX: !Ref TeamConfigPrefix
          ARTIFACT_BUCKET: !If [CreateArtifactBucket, !Ref TeamArtifactBucket, !Ref ArtifactBucketName]
          DDB_TABLE: !If [CreateDdbTable, !Ref ContentPipelineRunsTable, !Ref DdbTableName]
          VECTOR_DB_TABLE: !Ref VectorDbTable
          VECTOR_DB_HOST: !Ref VectorDbHost
          VECTOR_DB_PORT: !Ref VectorDbPort
          VECTOR_DB_NAME: !Ref VectorDbName
          VECTOR_DB_USER: !Ref VectorDbUser
          # VECTOR_DB_PASSWORD and VECTOR_DB_URL removed; fetch at runtime via VECTOR_DB_SECRET_ARN
          VECTOR_DB_SECRET_ARN: !Ref VectorDbSecret
          VECTOR_DB_SSLMODE: verify-full
          VECTOR_DB_SSL_ROOT_CERT: /var/task/certs/rds-ca-bundle.pem
          GEMINI_SECRET_ARN: !Ref GeminiSecretArn
          CONTEXTWEAVE_URL: !Ref ContextWeaveUrl
          STATE_MACHINE_ARN: !Ref StateMachine
          PROVISION_FUNCTION_NAME: !Ref ProvisionTeamFunction
          OBSERVATORY_METRICS_TABLE: !Ref ObservatoryMetricsTableName
          AMP_WORKSPACE_ID: !Ref AMPWorkspaceId
          AMP_REGION: !Ref AWS::Region
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue

  WorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn: WorkerFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/worker_handler.handler
      Role: !GetAtt WorkerRole.Arn
      Architectures:
        - arm64
      MemorySize: 1024
      # One invocation runs the whole pipeline -- every agent turn, its RAG
      # lookup, its tools and its schema validation -- so the budget is the
      # sum of all of them, not one call. At 300 s a three-agent team could
      # not finish, and the first real pipeline run ever attempted died on
      # exactly that: Sandbox.Timedout after 300.00 seconds. 900 is Lambda's
      # ceiling, which also bounds how large a team this architecture can
      # serve; past that the pipeline needs a state per step rather than a
      # loop inside one function.
      Timeout: 900
      Environment:
        Variables:
          CONFIG_BUCKET: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
          CONFIG_PREFIX: !Ref TeamConfigPrefix
          ARTIFACT_BUCKET: !If [CreateArtifactBucket, !Ref TeamArtifactBucket, !Ref ArtifactBucketName]
          DDB_TABLE: !If [CreateDdbTable, !Ref ContentPipelineRunsTable, !Ref DdbTableName]
          VECTOR_DB_TABLE: !Ref VectorDbTable
          VECTOR_DB_HOST: !Ref VectorDbHost
          VECTOR_DB_PORT: !Ref VectorDbPort
          VECTOR_DB_NAME: !Ref VectorDbName
          VECTOR_DB_USER: !Ref VectorDbUser
          # VECTOR_DB_PASSWORD and VECTOR_DB_URL removed; fetch at runtime via VECTOR_DB_SECRET_ARN
          VECTOR_DB_SECRET_ARN: !Ref VectorDbSecret
          VECTOR_DB_SSLMODE: verify-full
          VECTOR_DB_SSL_ROOT_CERT: /var/task/certs/rds-ca-bundle.pem
          GEMINI_SECRET_ARN: !Ref GeminiSecretArn
          CONTEXTWEAVE_URL: !Ref ContextWeaveUrl
          CONTEXTWEAVE_FEEDBACK_ON_VALID_OUTPUT: !Ref ContextWeaveFeedbackOnValidOutput
          # The health_prep pre-tool retrieves from this base. Empty when
          # ContextWeave published no health bucket, and the tool then uses
          # the health API instead. Set only here: a token-gated read of a
          # medical index does not belong on every function.
          HEALTH_KNOWLEDGE_BASE_ID: !If
            - HealthKnowledgeBaseEnabled
            - !Ref HealthKnowledgeBase
            - ""
          # financial_advisors retrieves from this base before the turn.
          # Set only on the worker: the excerpts are a pre-tool, not a
          # runtime concern. Web search uses Gemini Google Search grounding.
          # The key is GEMINI_SECRET_ARN unless WebSearchSecretArn overrides it.
          PORTFOLIO_KNOWLEDGE_BASE_ID: !Ref PortfolioKnowledgeBase
          WEB_SEARCH_PROVIDER: gemini
          WEB_SEARCH_SECRET_ARN: !If
            - HasWebSearchSecret
            - !Ref WebSearchSecretArn
            - !Ref "AWS::NoValue"
          GEMINI_LAMBDA_ARN: !GetAtt GeminiResearchFunction.Arn
          PROVISION_FUNCTION_NAME: !Ref ProvisionTeamFunction
          OBSERVATORY_METRICS_TABLE: !Ref ObservatoryMetricsTableName
          AMP_WORKSPACE_ID: !Ref AMPWorkspaceId
          AMP_REGION: !Ref AWS::Region
          DPO_TRAINING_BUCKET: !If [HasDPOBucket, !Ref DPOTrainingBucketName, !Ref "AWS::NoValue"]
          DPO_DELTA_THRESHOLD: !Ref DPODeltaThreshold
          DPO_PROJECT: !Sub "${AWS::StackName}"
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue

  ConversationFunction:
    Type: AWS::Serverless::Function
    DependsOn: ConversationFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/conversation_handler.handler
      Role: !GetAtt ConversationRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 180
      Events:
        AgentConverseEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /agent/converse
            Method: post
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue

  A2AFunction:
    Type: AWS::Serverless::Function
    DependsOn: A2AFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/a2a_handler.handler
      Role: !GetAtt A2ARole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          A2A_AGENT_VERSION: !Ref A2AAgentVersion
          A2A_PROVIDER: !Ref A2AProvider
          A2A_DOCUMENTATION_URL: !Ref A2ADocumentationUrl
          # The card is generated from the live team configs, so without the
          # bucket it advertises an agent with no skills -- which is what it
          # did: the deployed card served "skills": [] while twelve agents
          # were registered. A client discovering it learned TeamWeave can do
          # nothing.
          CONFIG_BUCKET: !If [CreateConfigBucket, !Ref TeamConfigBucket, !Ref ConfigBucketName]
          CONFIG_PREFIX: !Ref TeamConfigPrefix
          # message:send starts the same execution POST /team/task starts.
          # Without this the handler returns 500 on every call.
          STATE_MACHINE_ARN: !Ref StateMachine
      Events:
        # The well-known URI every A2A client fetches first.
        AgentCardEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /.well-known/agent-card.json
            Method: get
            # Public, and it has to be. The card is how a client learns this
            # API exists and how to authenticate against it, so putting it
            # behind that authentication makes it undiscoverable: TeamWeave's
            # own a2a_discovery fetches sibling cards with no credentials, so
            # TeamWeave could not be found by the mechanism it uses on others.
            # The card carries names and descriptions, never a secret, and
            # every operation it advertises stays authorized -- it declares
            # the bearer scheme so a client knows that before it calls.
            Auth:
              Authorizer: NONE
        A2ASendMessageEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /a2a/message:send
            Method: post
        A2AGetTaskEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /a2a/tasks/{task_id}
            Method: get
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue

  GeminiResearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-gemini-research-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: gemini-research-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:AssignIpv6Addresses
                  - ec2:UnassignIpv6Addresses
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini/api_key-*"

  GeminiResearchFunction:
    Type: AWS::Serverless::Function
    DependsOn: GeminiResearchFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: pbm-gemini-research
      CodeUri: ../
      Handler: config/examples/gemini_lambda.handler
      Role: !GetAtt GeminiResearchRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          MAX_TOKENS: "1024"
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
          Ipv6AllowedForDualStack: true
        - !Ref AWS::NoValue

  GeminiResearchFunctionInvokePermissionForBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GeminiResearchFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"

  ObservatoryMetricsFunction:
