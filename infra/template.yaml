  UnifiedObservabilityFunction:
    Type: AWS::Serverless::Function
    DependsOn: UnifiedObservabilityFunctionLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: src/orchestrator/unified_observability_handler.handler
      Role: !GetAtt UnifiedObservabilityRole.Arn
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          OBSERVATORY_METRICS_TABLE: !Ref ObservatoryMetricsTableName
          CONTEXTWEAVE_URL: !Ref ContextWeaveUrl
      Events:
        UnifiedObservabilityGet:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /observability
            Method: get
      VpcConfig: !If
        - HasVpcConfig
        - SecurityGroupIds:
            - !Ref OrchestratorSecurityGroup
          SubnetIds: !Split [",", !Ref LambdaSubnetIds]
