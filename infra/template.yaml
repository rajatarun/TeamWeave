            RestApiId: !Ref TeamWeaveApi
            Path: /teams
            Method: get
        TeamsPostEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeamWeaveApi
            Path: /teams
            Method: post
        TeamByNameGetEvent:
          Type: Api
